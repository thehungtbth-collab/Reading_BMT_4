c\":\"\"},{\"eng\":\"unpredictable\",\"vie\":\"khó đoán (uncertain, random)\",\"phonetic\":\"\"},{\"eng\":\"evidence\",\"vie\":\"bằng chứng (proof, data)\",\"phonetic\":\"\"},{\"eng\":\"challenging activities\",\"vie\":\"hoạt động đầy thử thách (demanding tasks, tough exercises)\",\"phonetic\":\"\"},{\"eng\":\"unfamiliar set-up\",\"vie\":\"tình huống lạ, bố trí không quen (new arrangement, strange situation)\",\"phonetic\":\"\"},{\"eng\":\"facilitate\",\"vie\":\"tạo điều kiện, hỗ trợ (enable, assist)\",\"phonetic\":\"\"},{\"eng\":\"self-regulate\",\"vie\":\"tự điều chỉnh (control oneself, manage independently)\",\"phonetic\":\"\"},{\"eng\":\"playful stimulus\",\"vie\":\"kích thích vui nhộn (fun trigger, amusing prompt)\",\"phonetic\":\"\"},{\"eng\":\"quiet backwater\",\"vie\":\"nơi hẻo lánh, yên tĩnh (remote place, isolated area)\",\"phonetic\":\"\"},{\"eng\":\"contrasts\",\"vie\":\"sự tương phản (differences, opposites)\",\"phonetic\":\"\"},{\"eng\":\"fundamental\",\"vie\":\"cơ bản, nền tảng (essential, basic)\",\"phonetic\":\"\"}],\"pData\":[{\"en\":[\"Brick by brick, six-year-old Alice is building a magical kingdom.\",\"Imagining fairy-tale turrets and fire-breathing dragons, wicked witches and gallant heroes, she’s creating an enchanting world.\",\"Although she isn’t aware of it, this fantasy is helping her take her first steps towards her capacity for creativity and so it will have important repercussions in her adult life.\"],\"vi\":[\"Từng viên gạch một, Alice sáu tuổi đang xây dựng một vương quốc phép thuật.\",\"Hãy tưởng tượng những tòa tháp cổ tích và những con rồng phun lửa, những phù thủy độc ác và những anh hùng dũng cảm, cô ấy đang tạo ra một thế giới đầy mê hoặc.\",\"Mặc dù cô ấy không nhận thức được điều đó, nhưng tưởng tượng này đang giúp cô ấy bước những bước đầu tiên hướng tới khả năng sáng tạo của mình và do đó nó sẽ có những tác động quan trọng trong cuộc sống trưởng thành của cô ấy.\"]},{\"en\":[\"Minutes later, Alice has abandoned the kingdom in favour of playing schools with her younger brother.\",\"When she bosses him around as his ‘teacher’, she’s practising how to regulate her emotions through pretence.\",\"Later on, when they tire of this and settle down with a board game, she’s learning about the need to follow rules and take turns with a partner.\"],\"vi\":[\"Vài phút sau, Alice đã từ bỏ vương quốc để đến trường chơi với em trai mình.\",\"Khi cô ra lệnh cho anh ta với tư cách là 'giáo viên' của anh ta, cô ấy đang thực hành cách điều chỉnh cảm xúc của mình thông qua việc giả vờ.\",\"Sau này, khi họ cảm thấy mệt mỏi với việc này và bắt đầu chơi board game, cô ấy học về sự cần thiết phải tuân theo các quy tắc và thay phiên nhau chơi với một đối tác.\"]},{\"en\":[\"‘Play in all its rich variety is one of the highest achievements of the human species,’ says Dr David Whitebread from the Faculty of Education at the University of Cambridge, UK. ‘It underpins how we develop as intellectual, problem-solving adults and is crucial to our success as a highly adaptable species.’\"],\"vi\":[\"Tiến sĩ David Whitebread từ Khoa Giáo dục tại Đại học Cambridge, Vương quốc Anh cho biết: “Chơi với tất cả sự đa dạng phong phú của nó là một trong những thành tựu cao nhất của loài người”. ‘Nó củng cố cách chúng ta phát triển với tư cách là những người trưởng thành có trí tuệ, giải quyết vấn đề và rất quan trọng đối với sự thành công của chúng ta với tư cách là một loài có khả năng thích nghi cao.’\"]},{\"en\":[\"Recognizing the importance of play is not new: over two millennia ago, the Greek philosopher Plato extolled its virtues as a means of developing skills for adult life, and ideas about play-based learning have been developing since the 19th century.\"],\"vi\":[\"Nhận thức được tầm quan trọng của vui chơi không phải là điều mới mẻ: hơn hai thiên niên kỷ trước, nhà triết học Hy Lạp Plato đã ca ngợi những ưu điểm của vui chơi như một phương tiện phát triển kỹ năng cho cuộc sống của người trưởng thành và các ý tưởng về học tập dựa trên vui chơi đã được phát triển từ thế kỷ 19.\"]},{\"en\":[\"But we live in changing times, and Whitebread is mindful of a worldwide decline in play, pointing out that over half the people in the world now live in cities. ‘The opportunities for free play, which I experienced almost every day of my childhood, are becoming increasingly scarce,’ he says.\",\"Outdoor play is curtailed by perceptions of risk to do with traffic, as well as parents’ increased wish to protect their children from being the victims of crime, and by the emphasis on ‘earlier is better’ which is leading to greater competition in academic learning and schools.\"],\"vi\":[\"Nhưng chúng ta đang sống trong thời đại thay đổi và Whitebread lưu ý đến sự suy giảm hoạt động vui chơi trên toàn thế giới, đồng thời chỉ ra rằng hơn một nửa số người trên thế giới hiện đang sống ở các thành phố. Anh nói: “Cơ hội chơi miễn phí mà tôi trải nghiệm gần như hàng ngày trong thời thơ ấu của mình đang ngày càng trở nên khan hiếm”.\",\"Vui chơi ngoài trời bị hạn chế do nhận thức về rủi ro liên quan đến giao thông cũng như mong muốn ngày càng tăng của phụ huynh trong việc bảo vệ con mình khỏi trở thành nạn nhân của tội phạm và do sự nhấn mạnh vào 'sớm càng tốt', điều này dẫn đến sự cạnh tranh lớn hơn trong học tập và trường học.\"]},{\"en\":[\"International bodies like the United Nations and the European Union have begun to develop policies concerned with children’s right to play, and to consider implications for leisure facilities and educational programmes.\",\"But what they often lack is the evidence to base policies on.\"],\"vi\":[\"Các cơ quan quốc tế như Liên hợp quốc và Liên minh châu Âu đã bắt đầu phát triển các chính sách liên quan đến quyền vui chơi của trẻ em và xem xét các tác động đối với các cơ sở giải trí và chương trình giáo dục.\",\"Nhưng điều họ thường thiếu là bằng chứng để làm cơ sở cho chính sách.\"]},{\"en\":[\"‘The type of play we are interested in is child-initiated, spontaneous and unpredictable – but, as soon as you ask a five-year-old “to play”, then you as the researcher have intervened,’ explains Dr Sara Baker. ‘And we want to know what the long-term impact of play is.\",\"It’s a real challenge.’\"],\"vi\":[\"Tiến sĩ Sara Baker giải thích: “Loại trò chơi mà chúng tôi quan tâm là do trẻ khởi xướng, tự phát và không thể đoán trước - nhưng ngay khi bạn yêu cầu một đứa trẻ 5 tuổi “chơi”, thì bạn với tư cách là nhà nghiên cứu đã can thiệp. ‘Và chúng tôi muốn biết tác động lâu dài của việc vui chơi là gì.\",\"Đó thực sự là một thử thách.”\"]},{\"en\":[\"Dr Jenny Gibson agrees, pointing out that although some of the steps in the puzzle of how and why play is important have been looked at, there is very little data on the impact it has on the child’s later life.\"],\"vi\":[\"Tiến sĩ Jenny Gibson đồng ý, chỉ ra rằng mặc dù một số bước trong câu đố về cách thức và lý do vui chơi lại quan trọng đã được xem xét, nhưng có rất ít dữ liệu về tác động của nó đối với cuộc sống sau này của trẻ.\"]},{\"en\":[\"Now, thanks to the university’s new Centre for Research on Play in Education, Development and Learning (PEDAL), Whitebread, Baker, Gibson and a team of researchers hope to provide evidence on the role played by play in how a child develops.\"],\"vi\":[\"Giờ đây, nhờ có Trung tâm Nghiên cứu Chơi trong Giáo dục, Phát triển và Học tập (PEDAL) mới của trường đại học, Whitebread, Baker, Gibson và một nhóm các nhà nghiên cứu hy vọng sẽ cung cấp bằng chứng về vai trò của trò chơi đối với sự phát triển của trẻ.\"]},{\"en\":[\"‘A strong possibility is that play supports the early development of children’s self-control,’ explains Baker. ‘This is our ability to develop awareness of our own thinking progresses – it influences how effectively we go about undertaking challenging activities.’\"],\"vi\":[\"Baker giải thích: “Có khả năng lớn là việc vui chơi hỗ trợ sự phát triển ban đầu về khả năng tự chủ của trẻ”. ‘Đây là khả năng phát triển nhận thức về sự tiến bộ trong suy nghĩ của chúng ta – nó ảnh hưởng đến mức độ hiệu quả của chúng ta khi thực hiện các hoạt động đầy thử thách.’\"]},{\"en\":[\"In a study carried out by Baker with toddlers and young pre-schoolers, she found that children with greater self-control solved problems more quickly when exploring an unfamiliar set-up requiring scientific reasoning. ‘This sort of evidence makes up think that giving children the chance to play will make them more successful problem-solvers in the long run.’\"],\"vi\":[\"Trong một nghiên cứu do Baker thực hiện với trẻ mới biết đi và trẻ mẫu giáo, cô phát hiện ra rằng trẻ có khả năng tự chủ cao hơn sẽ giải quyết vấn đề nhanh hơn khi khám phá một tình huống lạ đòi hỏi lý luận khoa học. ‘Loại bằng chứng này cho thấy rằng việc cho trẻ cơ hội vui chơi sẽ khiến chúng giải quyết vấn đề thành công hơn về lâu dài.’\"]},{\"en\":[\"If playful experiences do facilitate this aspect of development, say the researchers, it could be extremely significant for educational practices, because the ability to self-regulate has been shown to be a key predictor of academic performance.\"],\"vi\":[\"Các nhà nghiên cứu cho biết, nếu trải nghiệm vui chơi tạo điều kiện thuận lợi cho khía cạnh phát triển này thì nó có thể cực kỳ quan trọng đối với thực tiễn giáo dục, bởi vì khả năng tự điều chỉnh đã được chứng minh là một yếu tố dự báo chính về kết quả học tập.\"]},{\"en\":[\"Gibson adds: ‘Playful behavior is also an important indicator of healthy social and emotional development.\",\"In my previous research, I investigated how observing children at play can give us important clues about their well-being and can even be useful in the diagnosis of neurodevelopmental disorders like autism.’\"],\"vi\":[\"Gibson cho biết thêm: “Hành vi vui tươi cũng là một dấu hiệu quan trọng cho thấy sự phát triển lành mạnh về mặt xã hội và cảm xúc.\",\"Trong nghiên cứu trước đây của tôi, tôi đã tìm hiểu xem việc quan sát trẻ em chơi đùa có thể cho chúng ta những manh mối quan trọng về sức khỏe của chúng như thế nào và thậm chí có thể hữu ích trong việc chẩn đoán các chứng rối loạn phát triển thần kinh như chứng tự kỷ.'\"]},{\"en\":[\"Whitebread’s recent research has involved developing a play-based approach to supporting children’s writing. ‘Many primary school children find writing difficult, but we showed in a previous study that a playful stimulus was far more effective than an instructional one.’ Children wrote longer and better-structured stories when they first played with dolls representing characters in the story.\",\"In the latest study, children first created their story with Lego*, with similar results. ‘Many teachers commented that they had always previously had children saying they didn’t know what to write about.\",\"With the Lego building, however, not a single child said this through the whole year of the project.’\"],\"vi\":[\"Nghiên cứu gần đây của Whitebread liên quan đến việc phát triển phương pháp tiếp cận dựa trên trò chơi để hỗ trợ khả năng viết của trẻ em. ‘Nhiều học sinh tiểu học cảm thấy khó viết, nhưng trong một nghiên cứu trước đây, chúng tôi đã chỉ ra rằng kích thích vui tươi hiệu quả hơn nhiều so với kích thích mang tính hướng dẫn.’ Trẻ em viết những câu chuyện dài hơn và có cấu trúc tốt hơn khi lần đầu tiên chúng chơi với búp bê đại diện cho các nhân vật trong câu chuyện.\",\"Trong nghiên cứu mới nhất, trẻ em lần đầu tiên tạo ra câu chuyện của mình bằng Lego* và thu được kết quả tương tự. ‘Nhiều giáo viên nhận xét rằng trước đây họ luôn có học sinh nói rằng các em không biết viết về cái gì.\",\"Tuy nhiên, với tòa nhà Lego, không một đứa trẻ nào nói điều này trong suốt năm thực hiện dự án.”\"]},{\"en\":[\"Whitebread, who directs PEDAL, trained as a primary school teacher in the early 1970s, when, as he describes, ‘the teaching of young children was largely a quiet backwater, untroubled by any serious intellectual debate or controversy.’ Now, the landscape is very different, with hotly debated topics such as school starting age.\"],\"vi\":[\"Whitebread, người chỉ đạo PEDAL, được đào tạo thành giáo viên tiểu học vào đầu những năm 1970, khi ông mô tả, “việc giảng dạy trẻ nhỏ phần lớn là một vùng nước tù túng yên tĩnh, không gặp rắc rối bởi bất kỳ cuộc tranh luận hay tranh cãi trí tuệ nghiêm trọng nào”. Hiện nay, bối cảnh đã rất khác, với các chủ đề được tranh luận sôi nổi như độ tuổi bắt đầu đi học.\"]},{\"en\":[\"‘Somehow the importance of play has been lost in recent decades.\",\"It’s regarded as something trivial, or even as something negative that contrasts with “work”.\",\"Let’s not lose sight of its benefits, and the fundamental contributions it makes to human achievements in the arts, sciences and technology.\",\"Let’s make sure children have a rich diet of play experiences.’\"],\"vi\":[\"‘Bằng cách nào đó tầm quan trọng của việc vui chơi đã bị mất đi trong những thập kỷ gần đây.\",\"Nó được coi là một điều gì đó tầm thường, hoặc thậm chí là một điều gì đó tiêu cực trái ngược với “công việc”.\",\"Chúng ta đừng đánh mất những lợi ích của nó cũng như những đóng góp cơ bản mà nó mang lại cho những thành tựu của con người trong nghệ thuật, khoa học và công nghệ.\",\"Hãy đảm bảo trẻ em có được trải nghiệm vui chơi phong phú.”\"]}],\"timeLimit\":20,\"rawInputs\":{\"rawText\":\"Brick by brick, six-year-old Alice is building a magical kingdom. Imagining fairy-tale turrets and fire-breathing dragons, wicked witches and gallant heroes, she’s creating an enchanting world. Although she isn’t aware of it, this fantasy is helping her take her first steps towards her capacity for creativity and so it will have important repercussions in her adult life.\\n\\nMinutes later, Alice has abandoned the kingdom in favour of playing schools with her younger brother. When she bosses him around as his ‘teacher’, she’s practising how to regulate her emotions through pretence. Later on, when they tire of this and settle down with a board game, she’s learning about the need to follow rules and take turns with a partner.\\n\\n‘Play in all its rich variety is one of the highest achievements of the human species,’ says Dr David Whitebread from the Faculty of Education at the University of Cambridge, UK. ‘It underpins how we develop as intellectual, problem-solving adults and is crucial to our success as a highly adaptable species.’\\n\\nRecognizing the importance of play is not new: over two millennia ago, the Greek philosopher Plato extolled its virtues as a means of developing skills for adult life, and ideas about play-based learning have been developing since the 19th century.\\n\\nBut we live in changing times, and Whitebread is mindful of a worldwide decline in play, pointing out that over half the people in the world now live in cities. ‘The opportunities for free play, which I experienced almost every day of my childhood, are becoming increasingly scarce,’ he says. Outdoor play is curtailed by perceptions of risk to do with traffic, as well as parents’ increased wish to protect their children from being the victims of crime, and by the emphasis on ‘earlier is better’ which is leading to greater competition in academic learning and schools.\\n\\nInternational bodies like the United Nations and the European Union have begun to develop policies concerned with children’s right to play, and to consider implications for leisure facilities and educational programmes. But what they often lack is the evidence to base policies on.\\n\\n‘The type of play we are interested in is child-initiated, spontaneous and unpredictable – but, as soon as you ask a five-year-old “to play”, then you as the researcher have intervened,’ explains Dr Sara Baker. ‘And we want to know what the long-term impact of play is. It’s a real challenge.’\\n\\nDr Jenny Gibson agrees, pointing out that although some of the steps in the puzzle of how and why play is important have been looked at, there is very little data on the impact it has on the child’s later life.\\n\\nNow, thanks to the university’s new Centre for Research on Play in Education, Development and Learning (PEDAL), Whitebread, Baker, Gibson and a team of researchers hope to provide evidence on the role played by play in how a child develops.\\n\\n‘A strong possibility is that play supports the early development of children’s self-control,’ explains Baker. ‘This is our ability to develop awareness of our own thinking progresses – it influences how effectively we go about undertaking challenging activities.’\\n\\nIn a study carried out by Baker with toddlers and young pre-schoolers, she found that children with greater self-control solved problems more quickly when exploring an unfamiliar set-up requiring scientific reasoning. ‘This sort of evidence makes up think that giving children the chance to play will make them more successful problem-solvers in the long run.’\\n\\nIf playful experiences do facilitate this aspect of development, say the researchers, it could be extremely significant for educational practices, because the ability to self-regulate has been shown to be a key predictor of academic performance.\\n\\nGibson adds: ‘Playful behavior is also an important indicator of healthy social and emotional development. In my previous research, I investigated how observing children at play can give us important clues about their well-being and can even be useful in the diagnosis of neurodevelopmental disorders like autism.’\\n\\nWhitebread’s recent research has involved developing a play-based approach to supporting children’s writing. ‘Many primary school children find writing difficult, but we showed in a previous study that a playful stimulus was far more effective than an instructional one.’ Children wrote longer and better-structured stories when they first played with dolls representing characters in the story. In the latest study, children first created their story with Lego*, with similar results. ‘Many teachers commented that they had always previously had children saying they didn’t know what to write about. With the Lego building, however, not a single child said this through the whole year of the project.’\\n\\nWhitebread, who directs PEDAL, trained as a primary school teacher in the early 1970s, when, as he describes, ‘the teaching of young children was largely a quiet backwater, untroubled by any serious intellectual debate or controversy.’ Now, the landscape is very different, with hotly debated topics such as school starting age.\\n\\n‘Somehow the importance of play has been lost in recent decades. It’s regarded as something trivial, or even as something negative that contrasts with “work”. Let’s not lose sight of its benefits, and the fundamental contributions it makes to human achievements in the arts, sciences and technology. Let’s make sure children have a rich diet of play experiences.’\",\"transText\":\"Từng viên gạch một, Alice sáu tuổi đang xây dựng một vương quốc phép thuật.\\nHãy tưởng tượng những tòa tháp cổ tích và những con rồng phun lửa, những phù thủy độc ác và những anh hùng dũng cảm, cô ấy đang tạo ra một thế giới đầy mê hoặc.\\nMặc dù cô ấy không nhận thức được điều đó, nhưng tưởng tượng này đang giúp cô ấy bước những bước đầu tiên hướng tới khả năng sáng tạo của mình và do đó nó sẽ có những tác động quan trọng trong cuộc sống trưởng thành của cô ấy.\\n\\nVài phút sau, Alice đã từ bỏ vương quốc để đến trường chơi với em trai mình.\\nKhi cô ra lệnh cho anh ta với tư cách là 'giáo viên' của anh ta, cô ấy đang thực hành cách điều chỉnh cảm xúc của mình thông qua việc giả vờ.\\nSau này, khi họ cảm thấy mệt mỏi với việc này và bắt đầu chơi board game, cô ấy học về sự cần thiết phải tuân theo các quy tắc và thay phiên nhau chơi với một đối tác.\\n\\nTiến sĩ David Whitebread từ Khoa Giáo dục tại Đại học Cambridge, Vương quốc Anh cho biết: “Chơi với tất cả sự đa dạng phong phú của nó là một trong những thành tựu cao nhất của loài người”. ‘Nó củng cố cách chúng ta phát triển với tư cách là những người trưởng thành có trí tuệ, giải quyết vấn đề và rất quan trọng đối với sự thành công của chúng ta với tư cách là một loài có khả năng thích nghi cao.’\\n\\nNhận thức được tầm quan trọng của vui chơi không phải là điều mới mẻ: hơn hai thiên niên kỷ trước, nhà triết học Hy Lạp Plato đã ca ngợi những ưu điểm của vui chơi như một phương tiện phát triển kỹ năng cho cuộc sống của người trưởng thành và các ý tưởng về học tập dựa trên vui chơi đã được phát triển từ thế kỷ 19.\\n\\nNhưng chúng ta đang sống trong thời đại thay đổi và Whitebread lưu ý đến sự suy giảm hoạt động vui chơi trên toàn thế giới, đồng thời chỉ ra rằng hơn một nửa số người trên thế giới hiện đang sống ở các thành phố. Anh nói: “Cơ hội chơi miễn phí mà tôi trải nghiệm gần như hàng ngày trong thời thơ ấu của mình đang ngày càng trở nên khan hiếm”.\\nVui chơi ngoài trời bị hạn chế do nhận thức về rủi ro liên quan đến giao thông cũng như mong muốn ngày càng tăng của phụ huynh trong việc bảo vệ con mình khỏi trở thành nạn nhân của tội phạm và do sự nhấn mạnh vào 'sớm càng tốt', điều này dẫn đến sự cạnh tranh lớn hơn trong học tập và trường học.\\n\\nCác cơ quan quốc tế như Liên hợp quốc và Liên minh châu Âu đã bắt đầu phát triển các chính sách liên quan đến quyền vui chơi của trẻ em và xem xét các tác động đối với các cơ sở giải trí và chương trình giáo dục.\\nNhưng điều họ thường thiếu là bằng chứng để làm cơ sở cho chính sách.\\n\\nTiến sĩ Sara Baker giải thích: “Loại trò chơi mà chúng tôi quan tâm là do trẻ khởi xướng, tự phát và không thể đoán trước - nhưng ngay khi bạn yêu cầu một đứa trẻ 5 tuổi “chơi”, thì bạn với tư cách là nhà nghiên cứu đã can thiệp. ‘Và chúng tôi muốn biết tác động lâu dài của việc vui chơi là gì.\\nĐó thực sự là một thử thách.”\\n\\nTiến sĩ Jenny Gibson đồng ý, chỉ ra rằng mặc dù một số bước trong câu đố về cách thức và lý do vui chơi lại quan trọng đã được xem xét, nhưng có rất ít dữ liệu về tác động của nó đối với cuộc sống sau này của trẻ.\\n\\nGiờ đây, nhờ có Trung tâm Nghiên cứu Chơi trong Giáo dục, Phát triển và Học tập (PEDAL) mới của trường đại học, Whitebread, Baker, Gibson và một nhóm các nhà nghiên cứu hy vọng sẽ cung cấp bằng chứng về vai trò của trò chơi đối với sự phát triển của trẻ.\\n\\nBaker giải thích: “Có khả năng lớn là việc vui chơi hỗ trợ sự phát triển ban đầu về khả năng tự chủ của trẻ”. ‘Đây là khả năng phát triển nhận thức về sự tiến bộ trong suy nghĩ của chúng ta – nó ảnh hưởng đến mức độ hiệu quả của chúng ta khi thực hiện các hoạt động đầy thử thách.’\\n\\nTrong một nghiên cứu do Baker thực hiện với trẻ mới biết đi và trẻ mẫu giáo, cô phát hiện ra rằng trẻ có khả năng tự chủ cao hơn sẽ giải quyết vấn đề nhanh hơn khi khám phá một tình huống lạ đòi hỏi lý luận khoa học. ‘Loại bằng chứng này cho thấy rằng việc cho trẻ cơ hội vui chơi sẽ khiến chúng giải quyết vấn đề thành công hơn về lâu dài.’\\n\\nCác nhà nghiên cứu cho biết, nếu trải nghiệm vui chơi tạo điều kiện thuận lợi cho khía cạnh phát triển này thì nó có thể cực kỳ quan trọng đối với thực tiễn giáo dục, bởi vì khả năng tự điều chỉnh đã được chứng minh là một yếu tố dự báo chính về kết quả học tập.\\n\\nGibson cho biết thêm: “Hành vi vui tươi cũng là một dấu hiệu quan trọng cho thấy sự phát triển lành mạnh về mặt xã hội và cảm xúc.\\nTrong nghiên cứu trước đây của tôi, tôi đã tìm hiểu xem việc quan sát trẻ em chơi đùa có thể cho chúng ta những manh mối quan trọng về sức khỏe của chúng như thế nào và thậm chí có thể hữu ích trong việc chẩn đoán các chứng rối loạn phát triển thần kinh như chứng tự kỷ.'\\n\\nNghiên cứu gần đây của Whitebread liên quan đến việc phát triển phương pháp tiếp cận dựa trên trò chơi để hỗ trợ khả năng viết của trẻ em. ‘Nhiều học sinh tiểu học cảm thấy khó viết, nhưng trong một nghiên cứu trước đây, chúng tôi đã chỉ ra rằng kích thích vui tươi hiệu quả hơn nhiều so với kích thích mang tính hướng dẫn.’ Trẻ em viết những câu chuyện dài hơn và có cấu trúc tốt hơn khi lần đầu tiên chúng chơi với búp bê đại diện cho các nhân vật trong câu chuyện.\\nTrong nghiên cứu mới nhất, trẻ em lần đầu tiên tạo ra câu chuyện của mình bằng Lego* và thu được kết quả tương tự. ‘Nhiều giáo viên nhận xét rằng trước đây họ luôn có học sinh nói rằng các em không biết viết về cái gì.\\nTuy nhiên, với tòa nhà Lego, không một đứa trẻ nào nói điều này trong suốt năm thực hiện dự án.”\\n\\nWhitebread, người chỉ đạo PEDAL, được đào tạo thành giáo viên tiểu học vào đầu những năm 1970, khi ông mô tả, “việc giảng dạy trẻ nhỏ phần lớn là một vùng nước tù túng yên tĩnh, không gặp rắc rối bởi bất kỳ cuộc tranh luận hay tranh cãi trí tuệ nghiêm trọng nào”. Hiện nay, bối cảnh đã rất khác, với các chủ đề được tranh luận sôi nổi như độ tuổi bắt đầu đi học.\\n\\n‘Bằng cách nào đó tầm quan trọng của việc vui chơi đã bị mất đi trong những thập kỷ gần đây.\\nNó được coi là một điều gì đó tầm thường, hoặc thậm chí là một điều gì đó tiêu cực trái ngược với “công việc”.\\nChúng ta đừng đánh mất những lợi ích của nó cũng như những đóng góp cơ bản mà nó mang lại cho những thành tựu của con người trong nghệ thuật, khoa học và công nghệ.\\nHãy đảm bảo trẻ em có được trải nghiệm vui chơi phong phú.”\\n\",\"excelInput\":\"vương quốc huyền diệu (fairyland, enchanted realm)\\tChildren dream of a magical kingdom. (Trẻ em mơ về vương quốc huyền diệu.)\\t/ˈmæʤɪkl ˈkɪŋdəm/\\nmê hoặc, quyến rũ (captivating, delightful)\\tThe garden looked enchanting in spring. (Khu vườn trông mê hoặc vào mùa xuân.)\\t/ɪnˈʧæntɪŋ/\\nsức chứa, khả năng (ability, volume)\\tThe hall has a seating capacity of 500. (Hội trường có sức chứa 500 chỗ ngồi.)\\t/kəˈpæsɪti/\\nhậu quả (consequences, effects)\\tHis actions had serious repercussions. (Hành động của anh ấy có hậu quả nghiêm trọng.)\\t/ˌriːpərˈkʌʃənz/\\nbị bỏ rơi (deserted, neglected)\\tThe house was abandoned years ago. (Ngôi nhà bị bỏ rơi nhiều năm trước.)\\t/əˈbændənd/\\nđiều chỉnh, kiểm soát (control, manage)\\tLaws help regulate traffic. (Luật pháp giúp điều chỉnh giao thông.)\\t/ˈrɛɡjuleɪt/\\nthành tựu (accomplishments, successes)\\tShe celebrated her academic achievements. (Cô ấy ăn mừng thành tựu học tập của mình.)\\t/əˈʧiːvmənts/\\nthuộc trí tuệ (mental, cognitive)\\tHe is an intellectual leader. (Anh ấy là một nhà lãnh đạo trí tuệ.)\\t/ˌɪntlɪˈlɛkʧuəl/\\ndễ thích nghi (flexible, versatile)\\tHumans are highly adaptable to change. (Con người rất dễ thích nghi với sự thay đổi.)\\t/əˈdæptəbl/\\nhọc tập qua trò chơi (learning through play)\\tPreschoolers benefit from play-based learning. (Trẻ mẫu giáo được lợi từ học tập qua trò chơi.)\\t/pleɪ beɪst ˈlɜrnɪŋ/\\nchú tâm, thận trọng (aware, attentive)\\tBe mindful of your words. (Hãy chú tâm đến lời nói của bạn.)\\t/ˈmaɪndfl/\\nbị cắt giảm (reduced, limited)\\tThe program was curtailed due to lack of funds. (Chương trình bị cắt giảm vì thiếu kinh phí.)\\t/kɜːrˈteɪld/\\nnhận thức, quan niệm (views, beliefs)\\tCultural perceptions vary across countries. (Nhận thức văn hóa khác nhau giữa các quốc gia.)\\t/pərˈsɛpʃənz/\\nnạn nhân của tội phạm (sufferers, casualties)\\tSupport is offered to victims of crime. (Có hỗ trợ cho nạn nhân của tội phạm.)\\t/ˈvɪktɪmz əv kraɪm/\\nsự cạnh tranh (contest, rivalry)\\tThere is strong competition in business. (Có sự cạnh tranh mạnh trong kinh doanh.)\\t/ˌkɒmpəˈtɪʃən/\\ntự phát (impulsive, unplanned)\\tTheir laughter was spontaneous. (Tiếng cười của họ là tự phát.)\\t/spɒnˈteɪniəs/\\nkhó đoán (uncertain, random)\\tThe weather is unpredictable in April. (Thời tiết khó đoán vào tháng Tư.)\\t/ˌʌnprɪˈdɪktəbl/\\nbằng chứng (proof, data)\\tThe police found evidence of the crime. (Cảnh sát tìm thấy bằng chứng về tội phạm.)\\t/ˈɛvɪdəns/\\nhoạt động đầy thử thách (demanding tasks, tough exercises)\\tStudents enjoy challenging activities. (Học sinh thích các hoạt động đầy thử thách.)\\t/ˈʧælənʤɪŋ ækˈtɪvɪtiz/\\ntình huống lạ, bố trí không quen (new arrangement, strange situation)\\tHe felt nervous in an unfamiliar set-up. (Anh ấy thấy lo lắng trong tình huống lạ.)\\t/ˌʌnfəˈmɪliər sɛt ʌp/\\ntạo điều kiện, hỗ trợ (enable, assist)\\tTeachers facilitate group discussions. (Giáo viên tạo điều kiện cho thảo luận nhóm.)\\t/fəˈsɪlɪteɪt/\\ntự điều chỉnh (control oneself, manage independently)\\tChildren learn to self-regulate emotions. (Trẻ em học cách tự điều chỉnh cảm xúc.)\\t/ˌsɛlf ˈrɛɡjuleɪt/\\nkích thích vui nhộn (fun trigger, amusing prompt)\\tToys provide a playful stimulus for kids. (Đồ chơi mang lại kích thích vui nhộn cho trẻ.)\\t/ˈpleɪfl ˈstɪmjələs/\\nnơi hẻo lánh, yên tĩnh (remote place, isolated area)\\tHe lives in a quiet backwater village. (Anh ấy sống ở một ngôi làng hẻo lánh yên tĩnh.)\\t/ˈkwaɪət ˈbækwɔːtər/\\nsự tương phản (differences, opposites)\\tThe painting shows sharp contrasts in color. (Bức tranh thể hiện sự tương phản rõ rệt về màu sắc.)\\t/ˈkɒntræsts/\\ncơ bản, nền tảng (essential, basic)\\tFreedom is a fundamental right. (Tự do là quyền cơ bản.)\\t/ˌfʌndəˈmɛntl/\",\"txtHeadingsList\":\"\",\"mifOptions\":\"\",\"txtTfngMifList\":\"9     Children with good self-control are known to be likely to do well at school later on.\\n10   The way a child plays may provide information about possible medical problems.\\n11   Playing with dolls was found to benefit girls’ writing more than boys’ writing.\\n12   Children had problems thinking up ideas when they first created the story with Lego.\\n13   People nowadays regard children’s play as less significant than they did in the past.\",\"txtMatchFeature\":\"\",\"rawQuestions\":\"Complete the notes below.\\nChoose \\u003cb>\\u003cb>ONE WORD ONLY\\u003c/b>\\u003c/b> from the passage for each answer.\\nWrite your answers in boxes 1-8 on your answer sheet.\\n\\u003cb>\\u003cb><b>Children’s play</b>\\u003c/b>\\u003c/b>\\n\\u003cb>\\u003cb><b>Uses of children’s play</b>\\u003c/b>\\u003c/b>\\n•     building a ‘magical kingdom’ may help develop 1…………………………………\\n•     board games involve 2 ……………………………. and turn-taking\\n\\u003cb>\\u003cb>Recent changes affecting children’s play\\u003c/b>\\u003c/b>\\n•     population of 3 ………………………… have grown\\n•     opportunities for free play are limited due to\\n–  fear of 4 ………………………………\\n–  fear of 5 ………………………………\\n–  increased 6 …………………………… in schools\\n\\u003cb>\\u003cb>International policies on children’s play\\u003c/b>\\u003c/b>\\n•     it is difficult to find 7 …………………………… to support new policies\\n•     research needs to study the impact of play on the rest of the child’s 8 ……………………………..\\n\",\"bulkKeyInput\":\"1. creativity\\n2. rules\\n3. cities\\n4. traffic\\n5. crime\\n6. competition\\n7. evidence\\n8. life\\n9. TRUE\\n10. TRUE\\n11. NOT GIVEN\\n12. FALSE\\n13. TRUE\",\"timeLimitInput\":\"20\",\"chkMatchHeadings\":false,\"chkRemoveOpt\":false,\"chkTfngMif\":true,\"chkMatchFeature\":false,\"chkRemoveFeatureOpt\":false}}];\n\nlet currentLessonIndex = 0;\nlet qs, vocab, headings, headingKey, mifRange, removeOpt, removeFeatureOpt, pairs, pData;\n\nlet timeLeft = 0;\nlet timerInterval;\nconst timerEl = document.getElementById('timer');\n\nfunction startTimer() {\n    timerInterval = setInterval(() => {\n        if(timeLeft <= 0) {\n            clearInterval(timerInterval);\n            timerEl.innerText = \"00:00\";\n            alert(\"Time is up!\");\n            return;\n        }\n        timeLeft--;\n        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');\n        const s = (timeLeft % 60).toString().padStart(2, '0');\n        timerEl.innerText = `${m}:${s}`;\n    }, 1000);\n}\n\nfunction switchLesson(idx) {\n    currentLessonIndex = parseInt(idx);\n    const l = lessonsData[currentLessonIndex];\n    qs = l.qs; vocab = l.vocab; headings = l.headings; headingKey = l.headingKey;\n    mifRange = l.mifRange; removeOpt = l.removeOpt; removeFeatureOpt = l.removeFeatureOpt;\n    pairs = l.pairs; pData = l.pData;\n\n    // Reset UI\n    document.getElementById('articleArea').innerHTML = l.articleHtml;\n    document.getElementById('headingsArea').innerHTML = l.headingsHtml;\n    document.getElementById('qs').innerHTML = '';\n    document.getElementById('progressBar').innerHTML = '';\n    document.getElementById('saveBtn').style.display = 'none';\n    \n    // Reset Timer\n    clearInterval(timerInterval);\n    timeLeft = l.timeLimit * 60;\n    timerEl.innerText = \"--:--\";\n    startTimer();\n\n    // Render Questions & Attach Events\n    renderStudentQuestions();\n    attachEvents();\n\n    // Manage Views\n    if(document.getElementById('game-view').style.display === 'block') initGame();\n    if(document.getElementById('mif-view').style.display === 'flex') {\n        document.getElementById('mif-view').style.display = 'none';\n    }\n}\n\n// --- RENDERING QUESTIONS ---\nfunction renderStudentQuestions() {\n    const qDiv=document.getElementById('qs');\n    qDiv.innerHTML = '';\n    \n    qs.forEach(q=>{\n      if(q.type==='text-only'){ qDiv.innerHTML+=`<div class=\"text-only\">${q.text}</div>`; }\n      else if(q.type==='summary') { \n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          let txt = q.text.replace(/\\n/g, '<br>');\n          q.gapIds.forEach(gid => {\n              const isFeat = q.isFeature ? 'true' : 'false';\n              \n              const loc = (q.locations && q.locations[gid]) ? q.locations[gid] : \"\";\n              const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${gid})\">📍</button>` : \"\";\n              \n              const dz = `<span class=\"drop-zone\" id=\"dz-${gid}\" data-gid=\"${gid}\" data-isfeat=\"${isFeat}\" ondragover=\"allowDrop(event)\" ondrop=\"drop(event)\" onclick=\"clearDrop(${gid})\"></span><span class=\"q-num\" style=\"vertical-align:super;font-size:10px\">${gid}</span>${locBtn}&nbsp;`;\n              \n              // Dùng nối chuỗi (String concatenation) thay cho template literal để tránh lỗi invalid token\n              let replaced = txt.replace(new RegExp(gid + '\\\\s*([._…-]{2,}|_{2,}|…+)'), dz);\n              if(replaced === txt) replaced = txt.replace(new RegExp(gid + '[.]\\\\s+'), dz + ' ');\n              txt = replaced;\n              \n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n          h += `<div style=\"line-height:2;font-size:15px\">${txt}</div><div style=\"margin-top:15px;display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed #e2e8f0\">`;\n          q.options.forEach(optLine => {\n              const m = optLine.match(/^([A-Z])\\s*[.)]?\\s*(.+)/);\n              if(m) h += `<div class=\"heading-item\" id=\"opt-${q.id}-${m[1]}\" style=\"display:inline-flex;width:auto;margin:0\" draggable=\"true\" ondragstart=\"drag(event)\" data-val=\"${m[1]}\"><span style=\"font-weight:bold;color:#2563eb\">${m[1]}</span> ${m[2]}</div>`;\n          });\n          h += `</div><div id=\"fb-${q.id}\" style=\"margin-top:10px; font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n      }\n      else if(q.type==='gap-fill-block') { \n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          let txt = q.text.replace(/\\n/g, '<br>'); \n          q.gapIds.forEach(gid => {\n              const loc = (q.locations && q.locations[gid]) ? q.locations[gid] : \"\";\n              const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${gid})\">📍</button>` : \"\";\n              const inp = `<span class=\"q-num\">${gid}</span><input type=\"text\" class=\"gap-input\" data-gid=\"${gid}\" oninput=\"upd(${gid})\">${locBtn}&nbsp;`;\t\n              txt = txt.replace(new RegExp(`${gid}[\\\\s:.)]*(?:[_….\\\\-]\\\\s*){2,}`), inp);\n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n          h += `<div style=\"line-height:2.2;font-size:16px\">${txt}</div><div id=\"fb-${q.id}\" style=\"margin-top:10px; font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n      }\n      else if(q.type==='mcq-multi') {\n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          const locBtn1 = (q.locations && q.locations[q.gapIds[0]]) ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${q.gapIds[0]})\">📍</button>` : \"\";\n          h += `<div style=\"display:flex;align-items:baseline;margin-bottom:8px;\"><span class=\"q-num\">${q.gapIds[0]}-${q.gapIds[q.gapIds.length-1]}</span> <span>${q.text}</span> ${locBtn1}</div>`;\n          q.options.forEach((o, i) => {\n              const optLetterMatch = o.match(/^([A-Z])/i);\n              const optLetter = optLetterMatch ? optLetterMatch[1].toUpperCase() : o.trim()[0].toUpperCase();\n              h += `<label style=\"display:block;margin:5px 0;cursor:pointer;transition:all 0.2s;\">\n                      <input type=\"checkbox\" name=\"mcq_${q.id}\" value=\"${optLetter}\" onchange=\"updMcqMulti(${q.id}, '${q.gapIds.join(',')}', event)\"> ${o} <span id=\"mcq-mark-${q.id}-${i}\" class=\"mcq-mark\"></span>\n                    </label>`;\n          });\n          h += `<div id=\"fb-${q.id}\" class=\"feedback\" style=\"margin-top:8px;font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n          q.gapIds.forEach(gid => {\n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n      }\n      else { \n        let h=`<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n        const loc = q.location || \"\";\n        const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id})\">📍</button>` : \"\";\n        \n        if(q.type==='gap-fill'){\n           let t=q.text.replace(/(\\d+)[\\s:.)]*(?:[_….\\-]\\s*){2,}/g, '<span class=\"q-num\">$1</span><input type=\"text\" class=\"gap-input\" data-id=\"'+q.id+'\" oninput=\"upd('+q.id+')\">'+locBtn+'&nbsp;');\n           h+=`<div>${t}</div>`;\n        } else {\n           h+=`<div style=\"display:flex;align-items:baseline\"><span class=\"q-num\">${q.id}.</span> <span>${q.text}</span> ${locBtn}</div>`;\n           if(q.type==='mcq') q.options.forEach((o, i) => { h += `<label class=\"mcq-label\" style=\"display:block;margin:5px 0;cursor:pointer\"><input type=\"radio\" name=\"q${q.id}\" value=\"${o.trim()[0]}\" onchange=\"upd(${q.id})\"> ${o} <span id=\"mcq-mark-${q.id}-${i}\" class=\"mcq-mark\"></span></label>`; });\n           if(q.type==='tfng') {\n               h+='<div class=\"tfng-container\">';\n               ['TRUE', 'FALSE', 'NOT GIVEN'].forEach(opt => {\n                   h+=`<label class=\"tfng-label\"><input type=\"radio\" name=\"tfng${q.id}\" value=\"${opt}\" onchange=\"upd(${q.id})\"><span class=\"tfng-btn\">${opt}</span></label>`;\n               });\n               h+='</div>';\n           }\n           if(q.type==='ynng') {\n               h+='<div class=\"tfng-container\">';\n               ['YES', 'NO', 'NOT GIVEN'].forEach(opt => {\n                   h+=`<label class=\"tfng-label\"><input type=\"radio\" name=\"ynng${q.id}\" value=\"${opt}\" onchange=\"upd(${q.id})\"><span class=\"tfng-btn\">${opt}</span></label>`;\n               });\n               h+='</div>';\n           }\n           if(q.type==='mif') {\n               h+='<div class=\"mif-container\">';\n               mifRange.split('').forEach(char => {\n                   h+=`<label class=\"mif-label\"><input type=\"radio\" name=\"mif${q.id}\" value=\"${char}\" onchange=\"upd(${q.id})\"><span class=\"mif-circle\">${char}</span></label>`;\n               });\n               h+='</div>';\n           }\n        }\n        h+=`<div id=\"fb-${q.id}\" class=\"feedback\" style=\"margin-top:8px;font-size:13px\"></div></div>`;\n        qDiv.innerHTML+=h;\n        const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+q.id; d.innerText=q.id;\n        d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n        document.getElementById('progressBar').appendChild(d);\n      }\n    });\n\n    document.querySelectorAll('input[type=\"radio\"][name^=\"mif\"]').forEach(radio => {\n        radio.addEventListener('change', (e) => {\n            const qId = radio.name.replace('mif', '');\n            const pChar = radio.value;\n            document.querySelectorAll(`.mif-inline-btn[data-qid=\"${qId}\"]`).forEach(btn => {\n                const btnPara = btn.closest('.mif-inline-box').dataset.para;\n                if(btnPara === pChar) {\n                    btn.classList.remove('hidden-by-other');\n                    btn.classList.add('selected');\n                } else {\n                    btn.classList.remove('selected');\n                    btn.classList.add('hidden-by-other');\n                }\n            });\n        });\n    });\n}\n\nfunction attachEvents() {\n    const pp = document.getElementById('popup');\n    document.querySelectorAll('.vocab').forEach(s => {\n      s.onclick = e => {\n        const v = vocab.find(x => x.id === s.dataset.vid); if(!v) return;\n        pp.innerHTML = `<div style=\"background:#1e293b;color:#fff;padding:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center\"><div><span>${v.word}</span> <span style=\"font-weight:normal;font-size:12px;color:#94a3b8;margin-left:8px\">${v.phonetic||''}</span></div><span onclick=\"speak('${v.word}')\" style=\"cursor:pointer;background:#334155;padding:4px;border-radius:50%\">🔊</span></div><div style=\"padding:16px;font-size:14px;color:#334155\"><p style=\"margin-bottom:8px\"><b style=\"color:#0f172a\">Meaning:</b> ${v.meaning}</p><p style=\"margin-bottom:8px\"><b style=\"color:#0f172a\">Synonyms:</b> ${v.synonym}</p><div style=\"background:#f1f5f9;padding:8px;border-radius:6px;margin-top:8px;color:#475569;font-style:italic\">\"${v.example}\"</div></div>`;\n        pp.style.display = 'block'; pp.style.top = (e.clientY+10) + 'px'; pp.style.left = Math.min(e.clientX, window.innerWidth-330) + 'px';\n        e.stopPropagation();\n      }\n    });\n\n    document.querySelectorAll('.sent').forEach(el => {\n        el.addEventListener('mouseenter', () => {\n            const tid = el.getAttribute('data-target'); const t = document.getElementById(tid);\n            if(t) t.style.backgroundColor = '#fef08a'; \n        });\n        el.addEventListener('mouseleave', () => {\n            const tid = el.getAttribute('data-target'); const t = document.getElementById(tid);\n            if(t) t.style.backgroundColor = 'transparent';\n        });\n    });\n}\n\nfunction allowDrop(ev) { ev.preventDefault(); }\nfunction drag(ev) { \n    const el = ev.target.closest('[draggable=\"true\"]') || ev.target;\n    const val = el.dataset.val || el.innerText.split('.')[0].trim();\n    ev.dataTransfer.setData(\"text\", val); \n    ev.dataTransfer.setData(\"srcId\", el.id); \n}\nfunction dragHeading(ev) { \n    const el = ev.target.closest('.heading-item');\n    ev.dataTransfer.setData(\"hid\", el.dataset.hid); \n    ev.dataTransfer.setData(\"srcId\", el.id); \n}\nfunction drop(ev) {\n    ev.preventDefault();\n    const zone = ev.target.closest('.drop-zone');\n    if(!zone) return;\n    \n    const type = zone.dataset.type;\n    if (type === 'heading') {\n        const hid = ev.dataTransfer.getData(\"hid\");\n        if(!hid) return; \n        zone.innerHTML = hid.toUpperCase(); \n        zone.dataset.val = hid; \n        zone.classList.add('filled');\n        \n        const srcId = ev.dataTransfer.getData(\"srcId\");\n        document.getElementById(srcId).classList.add('used');\n        if(zone.dataset.prevSrc && zone.dataset.prevSrc !== srcId) document.getElementById(zone.dataset.prevSrc).classList.remove('used');\n        zone.dataset.prevSrc = srcId;\n        return;\n    }\n    const val = ev.dataTransfer.getData(\"text\");\n    if(val) {\n        zone.innerText = val; \n        zone.classList.add('filled');\n        const gid = zone.dataset.gid;\n        document.getElementById('prog-'+gid).classList.add('filled');\n        \n        const isFeat = zone.dataset.isfeat === 'true';\n        const doRemove = isFeat ? removeFeatureOpt : removeOpt;\n        \n        if(doRemove) {\n            const srcId = ev.dataTransfer.getData(\"srcId\");\n            if(srcId) {\n                const srcEl = document.getElementById(srcId);\n                if(srcEl) srcEl.classList.add('used');\n                if(zone.dataset.prevSrc && zone.dataset.prevSrc !== srcId) {\n                    const prevEl = document.getElementById(zone.dataset.prevSrc);\n                    if(prevEl) prevEl.classList.remove('used');\n                }\n                zone.dataset.prevSrc = srcId;\n            }\n        }\n    }\n}\n\nfunction clearHeading(idx) {\n    const el = document.querySelector(`.heading-drop[data-para=\"${idx}\"]`);\n    if(el.dataset.prevSrc) document.getElementById(el.dataset.prevSrc).classList.remove('used');\n    el.innerHTML = '<span class=\"placeholder\">Drop Heading Here</span>'; el.classList.remove('filled'); delete el.dataset.val;\n}\nfunction clearDrop(gid) {\n    const el = document.getElementById('dz-'+gid);\n    const isFeat = el.dataset.isfeat === 'true';\n    const doRemove = isFeat ? removeFeatureOpt : removeOpt;\n    \n    if(doRemove && el.dataset.prevSrc) {\n        const prevEl = document.getElementById(el.dataset.prevSrc);\n        if(prevEl) prevEl.classList.remove('used');\n        delete el.dataset.prevSrc;\n    }\n    \n    el.innerText=''; el.classList.remove('filled'); document.getElementById('prog-'+gid).classList.remove('filled');\n}\n\nconst hlToolbar = document.getElementById('hl-toolbar');\nlet currentRange = null;\ndocument.addEventListener('mouseup', (e) => {\n    if(e.target.closest('#hl-toolbar')) return;\n    if(e.target.closest('#game-view')) return;\n    setTimeout(() => {\n        const sel = window.getSelection();\n        if(sel.toString().trim().length > 0) {\n            const range = sel.getRangeAt(0);\n            const parent = range.commonAncestorContainer.parentElement;\n            if(parent.closest('.en-text') || parent.closest('.q-block') || parent.closest('.text-only')) {\n                currentRange = range;\n                const rect = range.getBoundingClientRect();\n                hlToolbar.style.display = 'flex'; \n                hlToolbar.style.top = (rect.top + window.scrollY - 40) + 'px'; \n                hlToolbar.style.left = (rect.left + (rect.width/2)) + 'px';\n                return;\n            }\n        }\n        hlToolbar.style.display = 'none';\n    }, 10);\n});\n\nwindow.applyHighlight = (e) => {\n    e.preventDefault(); e.stopPropagation();\n    if(currentRange) {\n        const span = document.createElement('span'); span.className = 'user-highlight'; span.setAttribute('onclick', 'removeHighlight(this, event)');\n        try { currentRange.surroundContents(span); window.getSelection().removeAllRanges(); } catch(err) { alert('Selection quá phức tạp, vui lòng bôi đen gọn hơn.'); }\n        hlToolbar.style.display = 'none';\n    }\n};\n\nwindow.applyNote = (e) => {\n    e.preventDefault(); e.stopPropagation();\n    if(currentRange) {\n        const noteText = prompt('Nhập ghi chú của bạn:');\n        if(noteText) {\n            const span = document.createElement('span'); \n            span.className = 'user-highlight has-note'; \n            span.setAttribute('onclick', 'removeHighlight(this, event)');\n            span.title = noteText;\n            try { currentRange.surroundContents(span); window.getSelection().removeAllRanges(); } catch(err) { alert('Selection quá phức tạp, vui lòng bôi đen gọn hơn.'); }\n        }\n        hlToolbar.style.display = 'none';\n    }\n};\n\nwindow.removeHighlight = (el, e) => { \n    e.stopPropagation(); \n    if(el.classList.contains('has-note') && !confirm('Xóa ghi chú này?')) return;\n    const txt = document.createTextNode(el.innerText); \n    el.parentNode.replaceChild(txt, el); \n    hlToolbar.style.display = 'none'; \n};\n\nwindow.showLoc = (qId, subId) => {\n    document.querySelectorAll('.loc-highlight').forEach(el => el.classList.remove('loc-highlight'));\n    const q = qs.find(x => x.id === qId); if(!q) return;\n    let text = \"\";\n    if(subId && q.locations && q.locations[subId]) text = q.locations[subId]; else if(q.location) text = q.location;\n    if(!text) return alert(\"No location data found.\");\n    \n    const cleanText = text.trim().replace(/\\s+/g, ' ').toLowerCase();\n    const sents = document.querySelectorAll('.sent'); let found = false;\n    sents.forEach(s => {\n        const sText = s.innerText.trim().replace(/\\s+/g, ' ').toLowerCase();\n        if(sText.includes(cleanText) || (cleanText.length > 20 && cleanText.includes(sText))) {\n            s.classList.add('loc-highlight');\n            if(!found) { s.scrollIntoView({behavior: 'smooth', block: 'center'}); found = true; }\n        }\n    });\n    if(!found) alert(\"Could not find exact text match in passage.\");\n};\n\nwindow.upd = (id) => document.getElementById('prog-'+id).classList.add('filled');\nwindow.updMcqMulti = (qId, gapIdsStr, ev) => {\n    const gapIds = gapIdsStr.split(',');\n    const checkboxes = document.querySelectorAll(`input[name=\"mcq_${qId}\"]`);\n    const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;\n    const maxAllowed = gapIds.length;\n    if (checkedCount > maxAllowed) { ev.target.checked = false; alert(\"Bạn chỉ được chọn tối đa \" + maxAllowed + \" đáp án!\"); return; }\n    gapIds.forEach((gid, index) => {\n        const p = document.getElementById('prog-'+gid);\n        if(p) { if(index < checkedCount) p.classList.add('filled'); else p.classList.remove('filled'); }\n    });\n};\n\nwindow.check = () => {\n    document.querySelectorAll('.ans-key, .inline-exp').forEach(e=>e.remove());\n    document.querySelectorAll('.input-correct, .input-wrong, .correct-zone, .wrong-zone, .correct-opt, .wrong-opt').forEach(e=>e.classList.remove('input-correct','input-wrong','correct-zone','wrong-zone','correct-opt','wrong-opt'));\n\tdocument.querySelectorAll('.prog-correct, .prog-wrong').forEach(e=>e.classList.remove('prog-correct','prog-wrong'));\n    document.querySelectorAll('.mcq-mark').forEach(e=>e.innerText='');\n\n    let score = 0, total = 0; let allAnswered = true;\n    \n    if(headings.length > 0) {\n        document.querySelectorAll('.heading-drop').forEach(z => {\n            const pIdx = z.dataset.para, userVal = (z.dataset.val || \"\").toUpperCase(), correctVal = (headingKey[pIdx] || \"\").toUpperCase();\n            if(correctVal) { \n                total++; const fb = document.getElementById('fb-h-'+pIdx);\n                if(userVal === correctVal) { fb.innerHTML = '<span class=\"correct\">✓</span>'; score++; } \n                else { fb.innerHTML = `<span class=\"wrong\">✗</span> <span class=\"correct\">${correctVal}</span>`; }\n            }\n        });\n    }\n\n    qs.forEach(q => {\n        if(q.type === 'summary' || q.type === 'gap-fill-block') {\n    total += q.gapIds.length;\n    q.gapIds.forEach(gid => {\n        let userVal = \"\"; let el = null; const keyVal = (q.answers[gid] || \"\").trim();\n        let isCorrect = false;\n\n        if(q.type==='summary') {\n            el=document.getElementById('dz-'+gid); userVal = el?el.innerText.trim():\"\";\n            if(el) {\n                if(userVal.toLowerCase() === keyVal.toLowerCase()) { el.classList.add('correct-zone'); isCorrect = true; }\n
