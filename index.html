      max-width:100%;
      width:100%;
      height:100vh;
      margin:0;
      padding:18px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;

    .btn-ghost{background:transparent;color:var(--accent2);border:1px solid rgba(37,117,252,0.12);color:var(--accent2);border-radius:10px;padding:8px 12px}
    .btn:hover{transform:translateY(-2px)}
    /* iframe chiếm phần còn lại */
    #frame{flex:1 1 auto;width:100%;min-height:0;border-radius:10px;border:1px solid #e6eef8;background:#fff}
    .meta{color:var(--muted);font-size:13px;margin-top:6px}
    /* fullscreen styles */
    .fullscreen-frame {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9998 !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .hidden { display: none !important; }
    #closeFullscreen {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10000;
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      background: rgba(255,255,255,0.95);
      color: #111;
      font-weight:700;
      box-shadow: 0 6px 18px rgba(16,24,40,0.12);
      cursor: pointer;
    }
    @media (max-width:640px){ .controls{flex-direction:column;align-items:stretch} select{width:100%} }
  </style>
</head>

r infinite; }\n  .g-slot:hover::after, .g-slot:focus::after, .g-slot.active::after, .g-slot.highlight::after{ opacity:1; animation: neonMove 2.2s linear infinite; }\n  .g-slot.correct::before{ background: linear-gradient(90deg, rgba(16,185,129,0.9), rgba(96,165,250,0.06)); opacity:0.6; filter:blur(10px); }\n  .g-slot.correct::after{ background: linear-gradient(90deg, rgba(16,185,129,0.95), rgba(6,182,212,0.06)); opacity:1; }\n\n  @keyframes neonMove{ 0%{background-position:0% 50%} 100%{background-position:200% 50%} }\n  @keyframes neonPulse{ 0%{filter:blur(6px); opacity:0.45} 50%{filter:blur(12px); opacity:0.7} 100%{filter:blur(6px); opacity:0.45} }\n\n  .g-vie-list{display:flex; flex-wrap:wrap; gap:10px; padding-top:6px;}\n  .g-vie-item{cursor:grab; user-select:none; padding:8px 12px; border-radius:10px; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03);}\n  .g-vie-item.dragging{opacity:0.5; transform:scale(0.98);}\n  .g-wrong{animation:shake 300ms; border-color:rgba(239,68,68,0.6);}\n  @keyframes shake{0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} 100%{transform:translateX(0)}}\n  \n  .g-badge{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.02); color:var(--muted); font-weight:600;}\n  .confetti{position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index: 3000;}\n  .confetti .piece{position:absolute; width:10px; height:14px; opacity:0; transform:translateY(-20px) rotate(0deg); animation:fall 1200ms linear forwards;}\n  @keyframes fall{0%{opacity:1; transform:translateY(-10vh) rotate(0deg)} 100%{opacity:1; transform:translateY(110vh) rotate(720deg)}}\n  \n  .flash-wrap{perspective:1200px; width:100%; max-width:520px;}\n  .flashcard{width:100%; height:140px; position:relative; transform-style:preserve-3d; transition:transform 600ms cubic-bezier(.2,.9,.3,1); border-radius:12px; cursor:pointer;}\n  .flashcard.flipped{transform:rotateY(180deg);}\n  .flash-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:18px; font-size:18px; text-align:center; box-shadow: 0 6px 18px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03);}\n  .flash-face.front{background:linear-gradient(180deg, rgba(6,182,212,0.08), rgba(96,165,250,0.03)); color:#e6f9fb;}\n  .flash-face.back{transform:rotateY(180deg); background:linear-gradient(180deg, rgba(16,185,129,0.06), rgba(96,165,250,0.02)); color:#eafff0;}\n\n  .fill-list{display:flex; flex-direction:column; gap:10px;}\n  .fill-row{display:flex; gap:12px; align-items:center;}\n  .fill-row .vie{flex:0 0 48%; min-width:160px; color:var(--muted);}\n  .fill-row input{ flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--input-muted-border); background: var(--input-muted-bg); color:var(--input-muted-text); transition:box-shadow 180ms, border-color 180ms, background-color 180ms; caret-color: var(--neon-primary); }\n  .fill-row input:focus{ outline:none; border-color: rgba(6,182,212,0.45); box-shadow: 0 6px 18px rgba(6,182,212,0.06); background: rgba(255,255,255,0.025); }\n  .fill-row input.correct{ border-color: rgba(16,185,129,0.7); box-shadow: 0 6px 18px rgba(16,185,129,0.04); background: rgba(16,185,129,0.02); }\n  .fill-row input.wrong{ border-color: rgba(244,63,94,0.7); box-shadow: 0 6px 18px rgba(244,63,94,0.03); background: rgba(244,63,94,0.01); }\n  .correct-answer{color: #10b981; font-size:12px; font-weight:700}\n  .wrong-answer{color: #ef4444; font-size:12px; font-weight:700}\n  \n  @media (max-width:880px){ .g-layout{grid-template-columns:1fr; flex-direction: column;} .g-card{flex-basis:100%; width:100%;} }\n  \n  .mif-inline-box { margin-top: 15px; padding: 12px; background: #eef2ff; border: 1px dashed #a5b4fc; border-radius: 8px; }\n  .mif-inline-btn { display: flex; align-items: flex-start; gap: 8px; background: #fff; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; color: #475569; line-height: 1.4; }\n  .mif-inline-btn:hover { border-color: #6366f1; background: #fafafa; }\n  .mif-inline-btn.selected { background: #6366f1; color: #fff; border-color: #6366f1; box-shadow: 0 2px 4px rgba(99,102,241,0.3); }\n  .mif-inline-btn.selected .q-num-s { color: #fff; }\n  .mif-inline-btn.hidden-by-other { display: none !important; }\n\n</style></head>\n<body>\n<div id=\"hl-toolbar\">\n  <button class=\"hl-btn-item\" onmousedown=\"applyHighlight(event)\">Highlight</button>\n  <button class=\"hl-btn-item\" onmousedown=\"applyNote(event)\">Note</button>\n</div>\n\n<div class=\"top-bar\">\n    <div style=\"display:flex;align-items:center;gap:15px;\">\n        <select id=\"lesson-selector\" onchange=\"switchLesson(this.value)\" style=\"padding:6px 12px; border-radius:6px; font-weight:bold; border:1px solid #cbd5e1; outline:none; cursor:pointer; background:#f8fafc; color:#334155;\"></select>\n        <div class=\"timer\" id=\"timer\">--:--</div>\n        <button class=\"game-btn\" onclick=\"toggleGame()\">🎮 Play Vocab Game</button>\n\t\t<button class=\"game-btn\" onclick=\"toggleMifMode()\" style=\"background:#8b5cf6;color:#fff\">🎯 Luyện Mif</button>\n    </div>\n    <div class=\"progress-container\" id=\"progressBar\"></div>\n    <div style=\"display:flex; align-items:center;\">\n        <button class=\"check-btn\" id=\"saveBtn\" onclick=\"saveResult()\" style=\"display:none; background:#f59e0b; margin-right:8px;\">SAVE RESULT</button>\n        <button class=\"check-btn\" onclick=\"check()\" id=\"submitBtn\">SUBMIT</button>\n    </div>\n</div>\n\n<div id=\"reading-view\" class=\"container\">\n  <div class=\"pane left\" id=\"lp\"><h2 style=\"font-size:18px; font-weight:700; color:#334155; margin-bottom:15px\">Reading Passage</h2><div id=\"articleArea\"></div></div>\n  <div class=\"resizer\" id=\"rs\"></div>\n  <div class=\"pane right\"><h2 style=\"font-size:18px; font-weight:700; color:#334155; margin-bottom:15px\">Questions</h2><div id=\"headingsArea\"></div><div id=\"qs\"></div></div>\n</div>\n\n<div id=\"game-view\">\n  <div class=\"g-container\">\n    <header class=\"g-header\">\n      <h1 class=\"g-h1\">Vocabulary Matching Game</h1>\n      <div class=\"g-controls\">\n        <div class=\"g-badge\" id=\"score\">Đúng: 0 / 0</div>\n        <button class=\"g-btn\" id=\"shuffleBtn\">Trộn</button>\n        <button class=\"g-btn\" id=\"resetBtn\">Làm lại</button>\n        <button class=\"g-btn\" style=\"background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff\" onclick=\"toggleGame()\">Close Game</button>\n      </div>\n    </header>\n\n    <section class=\"g-card\" style=\"margin-bottom:12px;\">\n      <h3 style=\"margin-top:0; color:var(--accent)\">Flashcards Ôn Tập</h3>\n      <div style=\"display:flex; gap:12px; align-items:center; flex-wrap:wrap;\">\n        <div class=\"flash-wrap\">\n          <div id=\"flashcard\" class=\"flashcard\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\n            <div class=\"flash-face front\" id=\"flashFront\">Nhấn Next để bắt đầu</div>\n            <div class=\"flash-face back\" id=\"flashBack\">Back</div>\n          </div>\n        </div>\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"display:flex; gap:8px;\">\n            <button class=\"g-btn\" id=\"prevCard\">Prev</button>\n            <button class=\"g-btn\" id=\"flipCard\">Flip</button>\n            <button class=\"g-btn\" id=\"nextCard\">Next</button>\n          </div>\n          <div style=\"display:flex; gap:8px;\">\n            <button class=\"g-btn\" id=\"autoPlay\">Auto</button>\n            <button class=\"g-btn\" id=\"showBoth\">Show Both</button>\n          </div>\n        </div>\n      </div>\n      <div class=\"small\" style=\"margin-top:8px; color:var(--muted); font-size:13px\">Nhấn flashcard để lật. Auto sẽ tự chuyển sau 2s. Show Both hiển thị cả 2 mặt tạm thời.</div>\n    </section>\n\n    <section class=\"g-layout\">\n      <div class=\"g-card\">\n        <h3 style=\"margin-top:0; color:var(--accent)\">Phần 1 Matching</h3>\n        <div class=\"small\" style=\"color:var(--muted); font-size:13px\">Kéo nghĩa vào ô tương ứng. Hoặc chạm để chọn rồi chạm vào ô.</div>\n        <div class=\"g-list\" id=\"engList\" style=\"margin-top:12px;\"></div>\n      </div>\n      <div class=\"g-card\">\n        <h3 style=\"margin-top:0; color:var(--accent)\">Phần 2 Vietnamese</h3>\n        <div class=\"g-vie-list\" id=\"vieList\" style=\"margin-top:12px;\"></div>\n      </div>\n    </section>\n\n    <section class=\"g-card\" style=\"margin-top:12px; margin-bottom: 50px;\">\n      <h3 style=\"margin-top:0; color:var(--accent)\">Bài Điền Chữ</h3>\n      <div class=\"small\" style=\"color:var(--muted); font-size:13px\">Bên trái là tiếng Việt, bên phải học sinh điền tiếng Anh. Nhấn Kiểm tra để chấm.</div>\n      <div style=\"margin-top:10px;\">\n        <div class=\"fill-list\" id=\"fillList\"></div>\n        <div style=\"margin-top:10px; display:flex; gap:8px; align-items:center;\">\n          <button class=\"g-btn\" id=\"checkFill\">Kiểm tra</button>\n          <button class=\"g-btn\" id=\"showAnswers\">Hiện đáp án</button>\n          <button class=\"g-btn\" id=\"resetFill\">Làm lại</button>\n          <div class=\"small\" id=\"fillScore\" style=\"align-self:center; color:var(--muted); font-size:13px\">Điểm: 0 / 0</div>\n        </div>\n      </div>\n    </section>\n  </div>\n</div>\n\n<div id=\"mif-view\">\n  <div class=\"mif-header\">\n    <h2 id=\"mif-title\" style=\"margin:0;color:#4338ca;font-size:18px\">Luyện Mif: Đoạn ...</h2>\n    <button class=\"mif-nav-btn\" style=\"background:#ef4444\" onclick=\"toggleMifMode()\">Đóng</button>\n  </div>\n  <div class=\"mif-body\">\n    <div class=\"mif-left\">\n      <div class=\"mif-col-container\">\n        <div class=\"mif-col\" id=\"mif-en-col\"></div>\n        <div class=\"mif-col\" id=\"mif-vi-col\"></div>\n      </div>\n    </div>\n    <div class=\"mif-right\">\n      <div id=\"mif-qs-container\" style=\"flex:1; overflow-y:auto; padding-bottom:20px;\"></div>\n      <div style=\"display:flex; justify-content:space-between; border-top:2px solid #cbd5e1; padding-top:15px; margin-top:10px;\">\n        <button class=\"mif-nav-btn\" id=\"mif-prev\" onclick=\"navMif(-1)\">⬅ Back</button>\n        <button class=\"mif-nav-btn\" id=\"mif-next\" onclick=\"navMif(1)\">Next ➡</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div id=\"popup\"></div>\n<div class=\"confetti\" id=\"confetti\"></div>\n\n<script>\n// --- MULTI-LESSON DATA INJECTION ---\nconst lessonsData = [{\"name\":\"Could urban engineers learn from dance?\",\"articleHtml\":\"\\u003cdiv class=\\\"reading-content\\\">\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph A\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s0\\\">The way we travel around cities has a major impact on whether they are \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v0\\\">sustainable\\u003c/span>. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s1\\\">Transportation is \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v1\\\">estimated\\u003c/span> to account for 30% of energy consumption in most of the world’s most developed nations, so \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v2\\\">lowering\\u003c/span> the need for \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v3\\\">energy-using vehicles\\u003c/span> is essential for decreasing the environmental impact of \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v4\\\">mobility\\u003c/span>. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s2\\\">But as more and more people move to cities, it is important to think about other kinds of \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v0\\\">sustainable\\u003c/span> travel too. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s3\\\">The ways we travel affect our physical and mental health, our social lives, our access to work and culture, and the air we breathe. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s4\\\">Engineers are tasked with changing how we travel round cities through urban design, but the engineering industry still works on the \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v5\\\">assumptions\\u003c/span> that led to the creation of the \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v6\\\">energy-consuming\\u003c/span> transport systems we have now: the \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v7\\\">emphasis\\u003c/span> placed solely on \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v22\\\">efficiency\\u003c/span>, speed, and \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v8\\\">quantitative data\\u003c/span>. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s5\\\">We need radical changes, to make it healthier, more enjoyable, and less environmentally damaging to travel around cities. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t0')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t0\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p0s0\\\" class=\\\"vi-sent\\\">Cách chúng ta di chuyển quanh các thành phố có tác động lớn đến việc liệu chúng có bền vững hay không. \\u003c/span>\\u003cspan id=\\\"p0s1\\\" class=\\\"vi-sent\\\">Giao thông vận tải được ước tính chiếm 30% mức tiêu thụ năng lượng ở hầu hết các quốc gia phát triển nhất thế giới, do đó việc giảm nhu cầu sử dụng các phương tiện sử dụng năng lượng là điều cần thiết để giảm tác động môi trường của việc di chuyển. \\u003c/span>\\u003cspan id=\\\"p0s2\\\" class=\\\"vi-sent\\\">Nhưng khi ngày càng có nhiều người chuyển đến các thành phố, điều quan trọng là phải nghĩ đến các loại hình du lịch bền vững khác. \\u003c/span>\\u003cspan id=\\\"p0s3\\\" class=\\\"vi-sent\\\">Cách chúng ta đi du lịch ảnh hưởng đến sức khỏe thể chất và tinh thần, đời sống xã hội, khả năng tiếp cận công việc và văn hóa cũng như không khí chúng ta hít thở. \\u003c/span>\\u003cspan id=\\\"p0s4\\\" class=\\\"vi-sent\\\">Các kỹ sư được giao nhiệm vụ thay đổi cách chúng ta di chuyển quanh các thành phố thông qua thiết kế đô thị, nhưng ngành kỹ thuật vẫn làm việc dựa trên các giả định dẫn đến việc tạo ra các hệ thống giao thông tiêu thụ năng lượng mà chúng ta hiện có: chỉ nhấn mạnh vào hiệu quả, tốc độ và dữ liệu định lượng. \\u003c/span>\\u003cspan id=\\\"p0s5\\\" class=\\\"vi-sent\\\">Chúng ta cần những thay đổi căn bản để làm cho việc đi lại quanh các thành phố trở nên lành mạnh hơn, thú vị hơn và ít gây hại cho môi trường hơn. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph B\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s0\\\">Dance might hold some of the answers. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s1\\\">That is not to suggest everyone should dance their way to work, however healthy and happy it might make us, but rather that the techniques used by choreographers to \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v9\\\">experiment\\u003c/span> with and design movement in dance could provide engineers with tools to \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v10\\\">stimulate\\u003c/span> new ideas in city-making. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s2\\\">Richard Sennett, an influential urbanist and sociologist who has transformed ideas about the way cities are made, argues that urban design has suffered from a separation between mind and body since the introduction of the architectural blueprint. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t1')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t1\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p1s0\\\" class=\\\"vi-sent\\\">Khiêu vũ có thể chứa một số câu trả lời. \\u003c/span>\\u003cspan id=\\\"p1s1\\\" class=\\\"vi-sent\\\">Điều đó không có nghĩa là mọi người nên nhảy theo cách của mình để đi làm, dù điều đó có thể khiến chúng ta khỏe mạnh và hạnh phúc đến đâu, mà đúng hơn là các kỹ thuật được các biên đạo múa sử dụng để thử nghiệm và thiết kế chuyển động trong khiêu vũ có thể cung cấp cho các kỹ sư những công cụ để kích thích những ý tưởng mới trong việc xây dựng thành phố. \\u003c/span>\\u003cspan id=\\\"p1s2\\\" class=\\\"vi-sent\\\">Richard Sennett, một nhà đô thị học và nhà xã hội học có ảnh hưởng, người đã thay đổi ý tưởng về cách hình thành các thành phố, lập luận rằng thiết kế đô thị đã phải chịu sự tách biệt giữa tinh thần và thể xác kể từ khi bản thiết kế kiến ​​trúc được đưa ra. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph C\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s0\\\">Whereas \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v11\\\">medieval\\u003c/span> builders \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v12\\\">improvised\\u003c/span> and adapted construction through their \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v13\\\">intimate knowledge\\u003c/span> of materials and personal experience of the conditions on a site, building designs are now \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v14\\\">conceived\\u003c/span> and stored in media technologies that detach the designer from the physical and social realities they are creating. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s1\\\">While the design practices created by these new technologies are essential for managing the \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v15\\\">technical complexity\\u003c/span> of the modern city, they have the \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v16\\\">drawback\\u003c/span> of simplifying reality in the process. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t2')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t2\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p2s0\\\" class=\\\"vi-sent\\\">Trong khi các nhà xây dựng thời Trung cổ ứng biến và điều chỉnh việc xây dựng thông qua kiến ​​thức sâu sắc về vật liệu và kinh nghiệm cá nhân về điều kiện trên địa điểm, các thiết kế xây dựng hiện được hình thành và lưu trữ trong các công nghệ truyền thông giúp tách nhà thiết kế khỏi thực tế vật chất và xã hội mà họ đang tạo ra. \\u003c/span>\\u003cspan id=\\\"p2s1\\\" class=\\\"vi-sent\\\">Mặc dù các phương pháp thiết kế được tạo ra bởi các công nghệ mới này là cần thiết để quản lý sự phức tạp về mặt kỹ thuật của thành phố hiện đại, nhưng chúng có nhược điểm là đơn giản hóa thực tế trong quá trình này. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph D\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s0\\\">To illustrate, Sennett discusses the Peachtree Center in Atlanta, USA, a development typical of the modernist approach to urban planning \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v17\\\">prevalent\\u003c/span> in the 1970s. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s1\\\">Peachtree created a grid of streets and towers intended as a new \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v18\\\">pedestrian-friendly downtown\\u003c/span> for Atlanta. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s2\\\">According to Sennett, this failed because its designers had invested too much faith in \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v19\\\">computer-aided design\\u003c/span> to tell them how it would operate. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s3\\\">They failed to take into account that purpose-built street cafés could not operate in the hot sun without the protective awnings common in older buildings, and would need \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v6\\\">energy-consuming\\u003c/span> air conditioning instead, or that its giant car park would feel so \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v20\\\">unwelcoming\\u003c/span> that it would put people off getting out of their cars. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s4\\\">What seems entirely predictable and controllable on screen has unexpected results when \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v21\\\">translated into\\u003c/span> reality. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t3')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t3\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p3s0\\\" class=\\\"vi-sent\\\">Để minh họa, Sennett thảo luận về Trung tâm Peachtree ở Atlanta, Hoa Kỳ, một sự phát triển điển hình của cách tiếp cận hiện đại đối với quy hoạch đô thị phổ biến vào những năm 1970. \\u003c/span>\\u003cspan id=\\\"p3s1\\\" class=\\\"vi-sent\\\">Peachtree đã tạo ra một mạng lưới đường phố và các tòa tháp nhằm mục đích trở thành trung tâm thành phố mới thân thiện với người đi bộ ở Atlanta. \\u003c/span>\\u003cspan id=\\\"p3s2\\\" class=\\\"vi-sent\\\">Theo Sennett, điều này thất bại vì các nhà thiết kế của nó đã đầu tư quá nhiều niềm tin vào thiết kế có sự hỗ trợ của máy tính để cho họ biết nó sẽ hoạt động như thế nào. \\u003c/span>\\u003cspan id=\\\"p3s3\\\" class=\\\"vi-sent\\\">Họ đã không tính đến việc các quán cà phê đường phố được xây dựng có mục đích không thể hoạt động dưới ánh nắng nóng nếu không có mái hiên bảo vệ thường thấy trong các tòa nhà cũ và thay vào đó sẽ cần điều hòa không khí tiêu tốn năng lượng, hoặc bãi đậu xe khổng lồ của nó sẽ khiến mọi người cảm thấy không được chào đón đến mức khiến mọi người không muốn ra khỏi xe. \\u003c/span>\\u003cspan id=\\\"p3s4\\\" class=\\\"vi-sent\\\">Những gì tưởng chừng như hoàn toàn có thể đoán trước và kiểm soát được trên màn ảnh lại mang lại kết quả không ngờ khi được chuyển thành hiện thực. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph E\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s0\\\">The same is true in transport engineering, which uses models to predict and shape the way people move through the city. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s1\\\">Again, these models are necessary, but they are built on specific world views in which certain forms of \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v22\\\">efficiency\\u003c/span> and safety are considered and other experience of the city \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v23\\\">ignored\\u003c/span>. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s2\\\">Designs that seem logical in models appear counter-intuitive in the actual experience of their users. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s3\\\">The guard rails that will be familiar to anyone who has attempted to cross a British road, for example, were an engineering solution to pedestrian safety based on models that \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v24\\\">prioritise\\u003c/span> the smooth flow of traffic. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s4\\\">On wide major roads, they often guide pedestrians to specific crossing points and slow down their progress across the road by using staggered access points divide the crossing into two – one for each carriageway. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s5\\\">In doing so they make crossings feel longer, introducing \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v25\\\">psychological barriers\\u003c/span> greatly impacting those that are the least mobile, and encouraging others to make dangerous crossings to get around the guard rails. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s6\\\">These barriers don’t just make it harder to cross the road: they divide communities and decrease opportunities for healthy transport. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s7\\\">As a result, many are now being removed, causing disruption, cost, and waste. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t4')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t4\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p4s0\\\" class=\\\"vi-sent\\\">Điều này cũng đúng trong kỹ thuật vận tải, sử dụng các mô hình để dự đoán và định hình cách mọi người di chuyển trong thành phố. \\u003c/span>\\u003cspan id=\\\"p4s1\\\" class=\\\"vi-sent\\\">Một lần nữa, những mô hình này là cần thiết, nhưng chúng được xây dựng trên thế giới quan cụ thể, trong đó các hình thức hiệu quả và an toàn nhất định được xem xét và những kinh nghiệm khác của thành phố bị bỏ qua. \\u003c/span>\\u003cspan id=\\\"p4s2\\\" class=\\\"vi-sent\\\">Những thiết kế có vẻ hợp lý trong mô hình lại có vẻ phản trực giác trong trải nghiệm thực tế của người dùng. \\u003c/span>\\u003cspan id=\\\"p4s3\\\" class=\\\"vi-sent\\\">Ví dụ: các lan can bảo vệ quen thuộc với bất kỳ ai đã cố gắng băng qua đường ở Anh là một giải pháp kỹ thuật nhằm đảm bảo an toàn cho người đi bộ dựa trên các mô hình ưu tiên luồng giao thông thông suốt. \\u003c/span>\\u003cspan id=\\\"p4s4\\\" class=\\\"vi-sent\\\">Trên những con đường lớn rộng rãi, họ thường hướng dẫn người đi bộ đến các điểm giao cắt cụ thể và làm chậm quá trình băng qua đường của họ bằng cách sử dụng các điểm tiếp cận so le chia đường giao nhau thành hai – một cho mỗi làn đường. \\u003c/span>\\u003cspan id=\\\"p4s5\\\" class=\\\"vi-sent\\\">Khi làm như vậy, họ làm cho việc băng qua đường có cảm giác dài hơn, tạo ra các rào cản tâm lý ảnh hưởng lớn đến những người ít di chuyển nhất và khuyến khích những người khác thực hiện các bước băng qua nguy hiểm để đi vòng qua lan can bảo vệ. \\u003c/span>\\u003cspan id=\\\"p4s6\\\" class=\\\"vi-sent\\\">Những rào cản này không chỉ khiến việc băng qua đường trở nên khó khăn hơn mà còn gây chia rẽ cộng đồng và làm giảm cơ hội giao thông lành mạnh. \\u003c/span>\\u003cspan id=\\\"p4s7\\\" class=\\\"vi-sent\\\">Kết quả là, nhiều nơi hiện đang bị loại bỏ, gây gián đoạn, tốn kém và lãng phí. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph F\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s0\\\">If their designers had had the tools to think with their bodies – like dancers – and imagine how these barriers would feel, there might have been a better solution. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s1\\\">In order to bring about \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v26\\\">fundamental\\u003c/span> changes to the ways we use our cities, engineering will need to develop a richer understanding of why people move in certain ways, and how this movement affects them. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s2\\\">Choreography may not seem an obvious choice for \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v27\\\">tackling\\u003c/span> this problem. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s3\\\">Yet it shares with engineering the aim of designing patterns of movement within limitations of space. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s4\\\">It is an art form developed almost entirely by trying out ideas with the body, and gaining instant feedback on how the results feel. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s5\\\">Choreographers have deep understanding of the psychological, aesthetic, and \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v28\\\">physical implications\\u003c/span> of different ways of moving. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t5')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t5\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p5s0\\\" class=\\\"vi-sent\\\">Nếu các nhà thiết kế của họ có công cụ để suy nghĩ bằng cơ thể của họ - giống như các vũ công - và tưởng tượng những rào cản này sẽ mang lại cảm giác như thế nào thì có lẽ đã có giải pháp tốt hơn. \\u003c/span>\\u003cspan id=\\\"p5s1\\\" class=\\\"vi-sent\\\">Để mang lại những thay đổi cơ bản trong cách chúng ta sử dụng các thành phố của mình, ngành kỹ thuật sẽ cần phát triển sự hiểu biết phong phú hơn về lý do tại sao mọi người di chuyển theo những cách nhất định và phong trào này ảnh hưởng đến họ như thế nào. \\u003c/span>\\u003cspan id=\\\"p5s2\\\" class=\\\"vi-sent\\\">Vũ đạo có vẻ không phải là một lựa chọn hiển nhiên để giải quyết vấn đề này. \\u003c/span>\\u003cspan id=\\\"p5s3\\\" class=\\\"vi-sent\\\">Tuy nhiên, nó có chung mục đích với kỹ thuật là thiết kế các mô hình chuyển động trong giới hạn không gian. \\u003c/span>\\u003cspan id=\\\"p5s4\\\" class=\\\"vi-sent\\\">Đó là một loại hình nghệ thuật được phát triển gần như hoàn toàn bằng cách thử nghiệm các ý tưởng với cơ thể và nhận được phản hồi ngay lập tức về cảm giác của kết quả. \\u003c/span>\\u003cspan id=\\\"p5s5\\\" class=\\\"vi-sent\\\">Các biên đạo múa có sự hiểu biết sâu sắc về ý nghĩa tâm lý, thẩm mỹ và thể chất của các cách di chuyển khác nhau. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph G\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s0\\\">Observing the choreographer Wayne McGregor, cognitive scientist David Kirsh described how he ‘thinks with the body’, Kirsh argues that by using the body to simulate outcomes, McGregor is able to imagine solutions that would not be possible using purely abstract thought. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s1\\\">This kind of physical knowledge is valued in many areas of \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v29\\\">expertise\\u003c/span>, but currently has no place in formal engineering design processes. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s2\\\">A suggested method for transport engineers is to improvise design solutions and instant feedback about how they would work from their own experience of them, or model designs at full scale in the way choreographers \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v9\\\">experiment\\u003c/span> with groups of dancers. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s3\\\">Above all, perhaps, they might learn to design for emotional as well as \\u003cspan class=\\\"vocab\\\" data-vid=\\\"v30\\\">functional\\u003c/span> effects. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t6')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t6\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p6s0\\\" class=\\\"vi-sent\\\">Quan sát biên đạo múa Wayne McGregor, nhà khoa học nhận thức David Kirsh đã mô tả cách anh ấy 'suy nghĩ bằng cơ thể', Kirsh lập luận rằng bằng cách sử dụng cơ thể để mô phỏng kết quả, McGregor có thể tưởng tượng ra các giải pháp không thể thực hiện được nếu chỉ sử dụng tư duy trừu tượng thuần túy. \\u003c/span>\\u003cspan id=\\\"p6s1\\\" class=\\\"vi-sent\\\">Loại kiến ​​thức vật lý này có giá trị trong nhiều lĩnh vực chuyên môn, nhưng hiện không có chỗ đứng trong các quy trình thiết kế kỹ thuật chính thức. \\u003c/span>\\u003cspan id=\\\"p6s2\\\" class=\\\"vi-sent\\\">Một phương pháp được đề xuất cho các kỹ sư vận tải là ứng biến các giải pháp thiết kế và phản hồi tức thì về cách họ sẽ làm việc dựa trên kinh nghiệm của chính họ hoặc thiết kế mô hình ở quy mô đầy đủ theo cách các biên đạo múa thử nghiệm với các nhóm vũ công. \\u003c/span>\\u003cspan id=\\\"p6s3\\\" class=\\\"vi-sent\\\">Trên hết, có lẽ họ có thể học cách thiết kế để mang lại hiệu quả về mặt cảm xúc cũng như chức năng. \\u003c/span>\\u003c/div>\\u003c/div>\\u003c/div>\",\"headingsHtml\":\"\",\"qs\":[{\"id\":1,\"type\":\"mif\",\"text\":\"reference to an appealing way of using dance that the writer is not proposing\",\"options\":[],\"correctAnswer\":\"B\",\"location\":\"That is not to suggest everyone should dance their way to work, however healthy and happy it might make us\",\"explanation\":\"1.\\tExplanation: Tác giả đề cập đến một ý tưởng thú vị là mọi người có thể \\\"nhảy múa để đi làm\\\" nhưng ngay lập tức khẳng định đây không phải là điều ông muốn đề xuất (not proposing).\\no\\tTừ đồng nghĩa: Appealing way ≈ Healthy and happy; Not proposing ≈ Not to suggest.\\no\\tĐáp án: B \\n\",\"_orderId\":1},{\"id\":2,\"type\":\"mif\",\"text\":\"an example of a contrast between past and present approaches to building\",\"options\":[],\"correctAnswer\":\"C\",\"location\":\"building designs are now conceived and stored in media technologies\",\"explanation\":\"2.\\tExplanation: Đoạn văn so sánh sự khác biệt giữa những người thợ xây thời trung cổ (quá khứ - past) làm việc dựa trên kinh nghiệm thực tế với các nhà thiết kế ngày nay (hiện tại - present) phụ thuộc vào công nghệ.\\no\\tTừ đồng nghĩa: Contrast ≈ Whereas; Past ≈ Medieval; Present ≈ Now.\\no\\tĐáp án: C \\n\",\"_orderId\":2},{\"id\":3,\"type\":\"mif\",\"text\":\"mention of an objective of both dance and engineering\",\"options\":[],\"correctAnswer\":\"F\",\"location\":\"Yet it shares with engineering the aim of designing patterns of movement within limitations of space\",\"explanation\":\"3.\\tExplanation: Cả múa (choreography) và kỹ thuật đô thị đều có chung một mục tiêu (objective) là thiết kế các kiểu mẫu chuyển động trong không gian hạn chế.\\no\\tTừ đồng nghĩa: Objective ≈ Aim; Both ≈ Shares with.\\no\\tĐáp án: F \\n\",\"_orderId\":3},{\"id\":4,\"type\":\"mif\",\"text\":\"reference to an unforeseen problem arising from ignoring the climate\",\"options\":[],\"correctAnswer\":\"D\",\"location\":\"They failed to take into account that purpose-built street cafés could not operate in the hot sun without the protective awnings\",\"explanation\":\"4.\\tExplanation: Việc bỏ qua yếu tố khí hậu (nắng nóng) khi thiết kế các quán cà phê ngoài trời tại Peachtree Center đã dẫn đến vấn đề ngoài dự kiến (unforeseen problem) là phải tốn thêm năng lượng cho điều hòa.\\no\\tTừ đồng nghĩa: Unforeseen problem ≈ Failed to take into account; Climate ≈ Hot sun.\\no\\tĐáp án: D \\n\",\"_orderId\":4},{\"id\":5,\"type\":\"mif\",\"text\":\"why some measures intended to help people are being reversed\",\"options\":[],\"correctAnswer\":\"E\",\"location\":\"As a result, many are now being removed, causing disruption, cost, and waste\",\"explanation\":\"5.\\tExplanation: Các rào chắn (guard rails) từng được lắp đặt để giúp người đi bộ nhưng nay đang bị dỡ bỏ (reversed/removed) vì chúng gây ra những rào cản tâm lý và chia cắt cộng đồng.\\no\\tTừ đồng nghĩa: Measures intended to help ≈ Engineering solution to pedestrian safety; Reversed ≈ Removed.\\no\\tĐáp án: E \\n\",\"_orderId\":5},{\"id\":6,\"type\":\"mif\",\"text\":\"reference to how transport has an impact on human lives\",\"options\":[],\"correctAnswer\":\"A\",\"location\":\"The ways we travel affect our physical and mental health, our social lives, our access to work and culture, and the air we breathe\",\"explanation\":\"6.\\tExplanation: Đoạn văn liệt kê hàng loạt các tác động của giao thông vận tải đến cuộc sống con người: từ sức khỏe, đời sống xã hội đến khả năng tiếp cận công việc và văn hóa.\\no\\tTừ đồng nghĩa: Impact on human lives ≈ Affect our physical and mental health, social lives, access to work...\\no\\tĐáp án: A \\n\",\"_orderId\":6},{\"type\":\"gap-fill-block\",\"id\":7,\"text\":\"Complete the summary below.\\nChoose \\u003cb>ONE WORD ONLY\\u003c/b> from the passage for each answer.\\nWrite your answers in boxes 7-13 on your answer sheet.\\n\\u003cb>Guard rails\\u003c/b>\\nGuard rails were introduced on British roads to improve the 7…………………… of pedestrians, while ensuring that the movement of 8……………………. is not disrupted. Pedestrians are led to access points, and encouraged to cross one 9…………………….. at a time.\\nAn unintended effect is to create psychological difficulties in crossing the road, particularly for less 10………………….. people. Another result is that some people cross the road in a 11……………………. way. The guard rails separate 12……………………., and make it more difficult to introduce forms of transport that are 13…………………….\",\"gapIds\":[7,8,9,10,11,12,13],\"answers\":{\"7\":\"safety\",\"8\":\"traffic\",\"9\":\"carriageway\",\"10\":\"mobile\",\"11\":\"dangerous\",\"12\":\"communities\",\"13\":\"healthy\"},\"locations\":{\"7\":\"were an engineering solution to pedestrian safety\",\"8\":\"based on models that prioritise the smooth flow of traffic\",\"9\":\"divide the crossing into\",\"10\":\"greatly impacting those that are the least mobile\",\"11\":\"encouraging others to make dangerous crossings to get around the guard rails\",\"12\":\"These barriers don’t just make it harder to cross the road: they divide communities\",\"13\":\"and decrease opportunities for healthy transport\"},\"explanations\":{\"7\":\"7. Explanation: Rào chắn được đưa ra như một giải pháp kỹ thuật để cải thiện sự an toàn cho người đi bộ. * Loại từ: Danh từ (Noun). \\n* Từ đồng nghĩa: Improve ≈ Solution to. \\n* Từ cần điền: safety \\n\",\"8\":\"8. Explanation: Mục tiêu song song là đảm bảo sự di chuyển của dòng xe cộ (giao thông) không bị gián đoạn. * Loại từ: Danh từ (Noun). \\n* Từ đồng nghĩa: Movement of ≈ Flow of. \\n* Từ cần điền: traffic \\n\",\"9\":\"9. Explanation: Thiết kế các điểm tiếp cận so le buộc người đi bộ phải băng qua từng làn đường (lòng đường) một. \\n* Loại từ: Danh từ (Noun). \\n* Từ cần điền: carriageway \\n\",\"10\":\"10. Explanation: Rào chắn gây khó khăn tâm lý, đặc biệt là với những người ít có khả năng di chuyển linh hoạt. \\n* Loại từ: Tính từ (Adjective). \\n* Từ đồng nghĩa: Less mobile ≈ Least mobile. \\n* Từ cần điền: mobile \\n\",\"11\":\"11. Explanation: Một kết quả khác là nhiều người cố tình băng qua đường một cách nguy hiểm để tránh rào chắn. \\n* Loại từ: Tính từ (Adjective). \\n* Từ đồng nghĩa: Way ≈ Crossings. \\n* Từ cần điền: dangerous \\n\",\"12\":\"12. Explanation: Những rào chắn này tạo ra sự ngăn cách giữa các cộng đồng dân cư. \\n* Loại từ: Danh từ số nhiều (Plural Noun). \\n* Từ đồng nghĩa: Separate ≈ Divide. \\n* Từ cần điền: communities \\n\",\"13\":\"13. Explanation: Chúng cũng làm hạn chế việc triển khai các hình thức giao thông lành mạnh (như đi bộ hoặc đạp xe). \\n* Loại từ: Tính từ (Adjective). \\n* Từ đồng nghĩa: Forms of transport ≈ Transport. \\n* Từ cần điền: healthy \\n\"},\"_orderId\":7}],\"vocab\":[{\"id\":\"v0\",\"word\":\"sustainable\",\"meaning\":\"bền vững (eco-friendly, renewable)\",\"synonym\":\"We need sustainable energy solutions. (Chúng ta cần giải pháp năng lượng bền vững.)\",\"example\":\"/səˈsteɪnəbl/\",\"phonetic\":\"\"},{\"id\":\"v1\",\"word\":\"estimated\",\"meaning\":\"ước tính (calculated, approximated)\",\"synonym\":\"The cost was estimated at $500. (Chi phí được ước tính là 500 đô.)\",\"example\":\"/ˈɛstɪmeɪtɪd/\",\"phonetic\":\"\"},{\"id\":\"v2\",\"word\":\"lowering\",\"meaning\":\"hạ thấp, giảm (reducing, decreasing)\",\"synonym\":\"They are lowering energy consumption. (Họ đang giảm tiêu thụ năng lượng.)\",\"example\":\"/ˈloʊərɪŋ/\",\"phonetic\":\"\"},{\"id\":\"v3\",\"word\":\"energy-using vehicles\",\"meaning\":\"phương tiện tiêu thụ năng lượng (fuel-consuming cars)\",\"synonym\":\"Energy-using vehicles contribute to pollution. (Phương tiện tiêu thụ năng lượng gây ô nhiễm.)\",\"example\":\"/ˈɛnərʤi ˈjuːzɪŋ ˈviːɪklz/\",\"phonetic\":\"\"},{\"id\":\"v4\",\"word\":\"mobility\",\"meaning\":\"khả năng di chuyển (movement, transport)\",\"synonym\":\"Public transport improves urban mobility. (Giao thông công cộng cải thiện khả năng di chuyển đô thị.)\",\"example\":\"/moʊˈbɪlɪti/\",\"phonetic\":\"\"},{\"id\":\"v5\",\"word\":\"assumptions\",\"meaning\":\"giả định (beliefs, suppositions)\",\"synonym\":\"His theory is based on false assumptions. (Lý thuyết của anh ấy dựa trên giả định sai lầm.)\",\"example\":\"/əˈsʌmpʃənz/\",\"phonetic\":\"\"},{\"id\":\"v6\",\"word\":\"energy-consuming\",\"meaning\":\"tiêu thụ năng lượng (power-using, fuel-burning)\",\"synonym\":\"Factories are energy-consuming. (Các nhà máy tiêu thụ nhiều năng lượng.)\",\"example\":\"/ˈɛnərʤi kənˈsjuːmɪŋ/\",\"phonetic\":\"\"},{\"id\":\"v7\",\"word\":\"emphasis\",\"meaning\":\"sự nhấn mạnh (focus, importance)\",\"synonym\":\"The teacher placed emphasis on discipline. (Giáo viên nhấn mạnh vào kỷ luật.)\",\"example\":\"/ˈɛmfəsɪs/\",\"phonetic\":\"\"},{\"id\":\"v8\",\"word\":\"quantitative data\",\"meaning\":\"dữ liệu định lượng (numerical data, measurable info)\",\"synonym\":\"The report includes quantitative data. (Báo cáo có dữ liệu định lượng.)\",\"example\":\"/ˈkwɒntɪtətɪv ˈdeɪtə/\",\"phonetic\":\"\"},{\"id\":\"v9\",\"word\":\"experiment\",\"meaning\":\"thí nghiệm (test, trial)\",\"synonym\":\"They conducted an experiment in the lab. (Họ tiến hành thí nghiệm trong phòng thí nghiệm.)\",\"example\":\"/ɪkˈspɛrɪmənt/\",\"phonetic\":\"\"},{\"id\":\"v10\",\"word\":\"stimulate\",\"meaning\":\"kích thích (encourage, inspire)\",\"synonym\":\"Music can stimulate creativity. (Âm nhạc có thể kích thích sự sáng tạo.)\",\"example\":\"/ˈstɪmjuleɪt/\",\"phonetic\":\"\"},{\"id\":\"v11\",\"word\":\"medieval\",\"meaning\":\"thời trung cổ (Middle Ages, ancient)\",\"synonym\":\"Castles were built in the medieval period. (Lâu đài được xây dựng vào thời trung cổ.)\",\"example\":\"/ˌmɛdˈiːvl/\",\"phonetic\":\"\"},{\"id\":\"v12\",\"word\":\"improvised\",\"meaning\":\"ứng biến (spontaneous, made-up)\",\"synonym\":\"He gave an improvised speech. (Anh ấy phát biểu ứng biến.)\",\"example\":\"/ˈɪmprəvaɪzd/\",\"phonetic\":\"\"},{\"id\":\"v13\",\"word\":\"intimate knowledge\",\"meaning\":\"hiểu biết sâu sắc (deep understanding, close familiarity)\",\"synonym\":\"She has intimate knowledge of the subject. (Cô ấy có hiểu biết sâu sắc về chủ đề.)\",\"example\":\"/ˈɪntɪmət ˈnɒlɪʤ/\",\"phonetic\":\"\"},{\"id\":\"v14\",\"word\":\"conceived\",\"meaning\":\"hình thành, nghĩ ra (imagined, devised)\",\"synonym\":\"The project was conceived last year. (Dự án được hình thành năm ngoái.)\",\"example\":\"/kənˈsiːvd/\",\"phonetic\":\"\"},{\"id\":\"v15\",\"word\":\"technical complexity\",\"meaning\":\"độ phức tạp kỹ thuật (engineering difficulty)\",\"synonym\":\"The machine has high technical complexity. (Máy móc có độ phức tạp kỹ thuật cao.)\",\"example\":\"/ˈtɛknɪkl kəmˈplɛksɪti/\",\"phonetic\":\"\"},{\"id\":\"v16\",\"word\":\"drawback\",\"meaning\":\"nhược điểm (disadvantage, weakness)\",\"synonym\":\"The plan has one major drawback. (Kế hoạch có một nhược điểm lớn.)\",\"example\":\"/ˈdrɔːbæk/\",\"phonetic\":\"\"},{\"id\":\"v17\",\"word\":\"prevalent\",\"meaning\":\"phổ biến (widespread, common)\",\"synonym\":\"Smartphones are prevalent today. (Điện thoại thông minh rất phổ biến ngày nay.)\",\"example\":\"/ˈprɛvələnt/\",\"phonetic\":\"\"},{\"id\":\"v18\",\"word\":\"pedestrian-friendly downtown\",\"meaning\":\"trung tâm thành phố thân thiện với người đi bộ\",\"synonym\":\"The city built a pedestrian-friendly downtown. (Thành phố xây dựng trung tâm thân thiện với người đi bộ.)\",\"example\":\"/pəˈdɛstrɪən ˈfrɛndli ˈdaʊntaʊn/\",\"phonetic\":\"\"},{\"id\":\"v19\",\"word\":\"computer-aided design\",\"meaning\":\"thiết kế hỗ trợ bằng máy tính (CAD)\",\"synonym\":\"Engineers use computer-aided design for projects. (Kỹ sư dùng thiết kế hỗ trợ bằng máy tính cho dự án.)\",\"example\":\"/kəmˈpjuːtər ˈeɪdɪd dɪˈzaɪn/\",\"phonetic\":\"\"},{\"id\":\"v20\",\"word\":\"unwelcoming\",\"meaning\":\"không thân thiện (hostile, unfriendly)\",\"synonym\":\"The atmosphere felt unwelcoming. (Bầu không khí cảm thấy không thân thiện.)\",\"example\":\"/ʌnˈwɛlkəmɪŋ/\",\"phonetic\":\"\"},{\"id\":\"v21\",\"word\":\"translated into\",\"meaning\":\"được dịch sang, chuyển thành (converted, rendered)\",\"synonym\":\"The book was translated into Vietnamese. (Cuốn sách được dịch sang tiếng Việt.)\",\"example\":\"/trænsˈleɪtɪd ˈɪntuː/\",\"phonetic\":\"\"},{\"id\":\"v22\",\"word\":\"efficiency\",\"meaning\":\"hiệu quả (effectiveness, productivity)\",\"synonym\":\"The new system improves efficiency. (Hệ thống mới cải thiện hiệu quả.)\",\"example\":\"/ɪˈfɪʃənsi/\",\"phonetic\":\"\"},{\"id\":\"v23\",\"word\":\"ignored\",\"meaning\":\"bị bỏ qua (neglected, overlooked)\",\"synonym\":\"His advice was ignored. (Lời khuyên của anh ấy bị bỏ qua.)\",\"example\":\"/ɪɡˈnɔːrd/\",\"phonetic\":\"\"},{\"id\":\"v24\",\"word\":\"prioritise\",\"meaning\":\"ưu tiên (give precedence, focus on)\",\"synonym\":\"We must prioritise health. (Chúng ta phải ưu tiên sức khỏe.)\",\"example\":\"/praɪˈɒrətaɪz/\",\"phonetic\":\"\"},{\"id\":\"v25\",\"word\":\"psychological barriers\",\"meaning\":\"rào cản tâm lý (mental obstacles)\",\"synonym\":\"Fear creates psychological barriers to success. (Nỗi sợ tạo rào cản tâm lý cho thành công.)\",\"example\":\"/ˌsaɪkəˈlɒʤɪkl ˈbæriərz/\",\"phonetic\":\"\"},{\"id\":\"v26\",\"word\":\"fundamental\",\"meaning\":\"cơ bản, nền tảng (essential, basic)\",\"synonym\":\"Education is a fundamental right. (Giáo dục là quyền cơ bản.)\",\"example\":\"/ˌfʌndəˈmɛntl/\",\"phonetic\":\"\"},{\"id\":\"v27\",\"word\":\"tackling\",\"meaning\":\"giải quyết (addressing, dealing with)\",\"synonym\":\"They are tackling climate change. (Họ đang giải quyết biến đổi khí hậu.)\",\"example\":\"/ˈtæklɪŋ/\",\"phonetic\":\"\"},{\"id\":\"v28\",\"word\":\"physical implications\",\"meaning\":\"hệ quả vật lý (bodily effects, tangible outcomes)\",\"synonym\":\"Exercise has physical implications for health. (Tập thể dục có hệ quả vật lý đối với sức khỏe.)\",\"example\":\"/ˈfɪzɪkl ˌɪmplɪˈkeɪʃənz/\",\"phonetic\":\"\"},{\"id\":\"v29\",\"word\":\"expertise\",\"meaning\":\"chuyên môn (skill, proficiency)\",\"synonym\":\"She has expertise in engineering. (Cô ấy có chuyên môn trong ngành kỹ thuật.)\",\"example\":\"/ˌɛkspərˈtiːz/\",\"phonetic\":\"\"},{\"id\":\"v30\",\"word\":\"functional\",\"meaning\":\"chức năng, hữu dụng (practical, operational)\",\"synonym\":\"The design is both beautiful and functional. (Thiết kế vừa đẹp vừa hữu dụng.)\",\"example\":\"/ˈfʌŋkʃənl/\",\"phonetic\":\"\"}],\"headings\":[],\"headingKey\":{},\"mifRange\":\"ABCDEFG\",\"removeOpt\":false,\"removeFeatureOpt\":false,\"pairs\":[{\"eng\":\"sustainable\",\"vie\":\"bền vững (eco-friendly, renewable)\",\"phonetic\":\"\"},{\"eng\":\"estimated\",\"vie\":\"ước tính (calculated, approximated)\",\"phonetic\":\"\"},{\"eng\":\"lowering\",\"vie\":\"hạ thấp, giảm (reducing, decreasing)\",\"phonetic\":\"\"},{\"eng\":\"energy-using vehicles\",\"vie\":\"phương tiện tiêu thụ năng lượng (fuel-consuming cars)\",\"phonetic\":\"\"},{\"eng\":\"mobility\",\"vie\":\"khả năng di chuyển (movement, transport)\",\"phonetic\":\"\"},{\"eng\":\"assumptions\",\"vie\":\"giả định (beliefs, suppositions)\",\"phonetic\":\"\"},{\"eng\":\"energy-consuming\",\"vie\":\"tiêu thụ năng lượng (power-using, fuel-burning)\",\"phonetic\":\"\"},{\"eng\":\"emphasis\",\"vie\":\"sự nhấn mạnh (focus, importance)\",\"phonetic\":\"\"},{\"eng\":\"quantitative data\",\"vie\":\"dữ liệu định lượng (numerical data, measurable info)\",\"phonetic\":\"\"},{\"eng\":\"experiment\",\"vie\":\"thí nghiệm (test, trial)\",\"phonetic\":\"\"},{\"eng\":\"stimulate\",\"vie\":\"kích thích (encourage, inspire)\",\"phonetic\":\"\"},{\"eng\":\"medieval\",\"vie\":\"thời trung cổ (Middle Ages, ancient)\",\"phonetic\":\"\"},{\"eng\":\"improvised\",\"vie\":\"ứng biến (spontaneous, made-up)\",\"phonetic\":\"\"},{\"eng\":\"intimate knowledge\",\"vie\":\"hiểu biết sâu sắc (deep understanding, close familiarity)\",\"phonetic\":\"\"},{\"eng\":\"conceived\",\"vie\":\"hình thành, nghĩ ra (imagined, devised)\",\"phonetic\":\"\"},{\"eng\":\"technical complexity\",\"vie\":\"độ phức tạp kỹ thuật (engineering difficulty)\",\"phonetic\":\"\"},{\"eng\":\"drawback\",\"vie\":\"nhược điểm (disadvantage, weakness)\",\"phonetic\":\"\"},{\"eng\":\"prevalent\",\"vie\":\"phổ biến (widespread, common)\",\"phonetic\":\"\"},{\"eng\":\"pedestrian-friendly downtown\",\"vie\":\"trung tâm thành phố thân thiện với người đi bộ\",\"phonetic\":\"\"},{\"eng\":\"computer-aided design\",\"vie\":\"thiết kế hỗ trợ bằng máy tính (CAD)\",\"phonetic\":\"\"},{\"eng\":\"unwelcoming\",\"vie\":\"không thân thiện (hostile, unfriendly)\",\"phonetic\":\"\"},{\"eng\":\"translated into\",\"vie\":\"được dịch sang, chuyển thành (converted, rendered)\",\"phonetic\":\"\"},{\"eng\":\"efficiency\",\"vie\":\"hiệu quả (effectiveness, productivity)\",\"phonetic\":\"\"},{\"eng\":\"ignored\",\"vie\":\"bị bỏ qua (neglected, overlooked)\",\"phonetic\":\"\"},{\"eng\":\"prioritise\",\"vie\":\"ưu tiên (give precedence, focus on)\",\"phonetic\":\"\"},{\"eng\":\"psychological barriers\",\"vie\":\"rào cản tâm lý (mental obstacles)\",\"phonetic\":\"\"},{\"eng\":\"fundamental\",\"vie\":\"cơ bản, nền tảng (essential, basic)\",\"phonetic\":\"\"},{\"eng\":\"tackling\",\"vie\":\"giải quyết (addressing, dealing with)\",\"phonetic\":\"\"},{\"eng\":\"physical implications\",\"vie\":\"hệ quả vật lý (bodily effects, tangible outcomes)\",\"phonetic\":\"\"},{\"eng\":\"expertise\",\"vie\":\"chuyên môn (skill, proficiency)\",\"phonetic\":\"\"},{\"eng\":\"functional\",\"vie\":\"chức năng, hữu dụng (practical, operational)\",\"phonetic\":\"\"}],\"pData\":[{\"en\":[\"The way we travel around cities has a major impact on whether they are sustainable.\",\"Transportation is estimated to account for 30% of energy consumption in most of the world’s most developed nations, so lowering the need for energy-using vehicles is essential for decreasing the environmental impact of mobility.\",\"But as more and more people move to cities, it is important to think about other kinds of sustainable travel too.\",\"The ways we travel affect our physical and mental health, our social lives, our access to work and culture, and the air we breathe.\",\"Engineers are tasked with changing how we travel round cities through urban design, but the engineering industry still works on the assumptions that led to the creation of the energy-consuming transport systems we have now: the emphasis placed solely on efficiency, speed, and quantitative data.\",\"We need radical changes, to make it healthier, more enjoyable, and less environmentally damaging to travel around cities.\"],\"vi\":[\"Cách chúng ta di chuyển quanh các thành phố có tác động lớn đến việc liệu chúng có bền vững hay không.\",\"Giao thông vận tải được ước tính chiếm 30% mức tiêu thụ năng lượng ở hầu hết các quốc gia phát triển nhất thế giới, do đó việc giảm nhu cầu sử dụng các phương tiện sử dụng năng lượng là điều cần thiết để giảm tác động môi trường của việc di chuyển.\",\"Nhưng khi ngày càng có nhiều người chuyển đến các thành phố, điều quan trọng là phải nghĩ đến các loại hình du lịch bền vững khác.\",\"Cách chúng ta đi du lịch ảnh hưởng đến sức khỏe thể chất và tinh thần, đời sống xã hội, khả năng tiếp cận công việc và văn hóa cũng như không khí chúng ta hít thở.\",\"Các kỹ sư được giao nhiệm vụ thay đổi cách chúng ta di chuyển quanh các thành phố thông qua thiết kế đô thị, nhưng ngành kỹ thuật vẫn làm việc dựa trên các giả định dẫn đến việc tạo ra các hệ thống giao thông tiêu thụ năng lượng mà chúng ta hiện có: chỉ nhấn mạnh vào hiệu quả, tốc độ và dữ liệu định lượng.\",\"Chúng ta cần những thay đổi căn bản để làm cho việc đi lại quanh các thành phố trở nên lành mạnh hơn, thú vị hơn và ít gây hại cho môi trường hơn.\"]},{\"en\":[\"Dance might hold some of the answers.\",\"That is not to suggest everyone should dance their way to work, however healthy and happy it might make us, but rather that the techniques used by choreographers to experiment with and design movement in dance could provide engineers with tools to stimulate new ideas in city-making.\",\"Richard Sennett, an influential urbanist and sociologist who has transformed ideas about the way cities are made, argues that urban design has suffered from a separation between mind and body since the introduction of the architectural blueprint.\"],\"vi\":[\"Khiêu vũ có thể chứa một số câu trả lời.\",\"Điều đó không có nghĩa là mọi người nên nhảy theo cách của mình để đi làm, dù điều đó có thể khiến chúng ta khỏe mạnh và hạnh phúc đến đâu, mà đúng hơn là các kỹ thuật được các biên đạo múa sử dụng để thử nghiệm và thiết kế chuyển động trong khiêu vũ có thể cung cấp cho các kỹ sư những công cụ để kích thích những ý tưởng mới trong việc xây dựng thành phố.\",\"Richard Sennett, một nhà đô thị học và nhà xã hội học có ảnh hưởng, người đã thay đổi ý tưởng về cách hình thành các thành phố, lập luận rằng thiết kế đô thị đã phải chịu sự tách biệt giữa tinh thần và thể xác kể từ khi bản thiết kế kiến ​​trúc được đưa ra.\"]},{\"en\":[\"Whereas medieval builders improvised and adapted construction through their intimate knowledge of materials and personal experience of the conditions on a site, building designs are now conceived and stored in media technologies that detach the designer from the physical and social realities they are creating.\",\"While the design practices created by these new technologies are essential for managing the technical complexity of the modern city, they have the drawback of simplifying reality in the process.\"],\"vi\":[\"Trong khi các nhà xây dựng thời Trung cổ ứng biến và điều chỉnh việc xây dựng thông qua kiến ​​thức sâu sắc về vật liệu và kinh nghiệm cá nhân về điều kiện trên địa điểm, các thiết kế xây dựng hiện được hình thành và lưu trữ trong các công nghệ truyền thông giúp tách nhà thiết kế khỏi thực tế vật chất và xã hội mà họ đang tạo ra.\",\"Mặc dù các phương pháp thiết kế được tạo ra bởi các công nghệ mới này là cần thiết để quản lý sự phức tạp về mặt kỹ thuật của thành phố hiện đại, nhưng chúng có nhược điểm là đơn giản hóa thực tế trong quá trình này.\"]},{\"en\":[\"To illustrate, Sennett discusses the Peachtree Center in Atlanta, USA, a development typical of the modernist approach to urban planning prevalent in the 1970s.\",\"Peachtree created a grid of streets and towers intended as a new pedestrian-friendly downtown for Atlanta.\",\"According to Sennett, this failed because its designers had invested too much faith in computer-aided design to tell them how it would operate.\",\"They failed to take into account that purpose-built street cafés could not operate in the hot sun without the protective awnings common in older buildings, and would need energy-consuming air conditioning instead, or that its giant car park would feel so unwelcoming that it would put people off getting out of their cars.\",\"What seems entirely predictable and controllable on screen has unexpected results when translated into reality.\"],\"vi\":[\"Để minh họa, Sennett thảo luận về Trung tâm Peachtree ở Atlanta, Hoa Kỳ, một sự phát triển điển hình của cách tiếp cận hiện đại đối với quy hoạch đô thị phổ biến vào những năm 1970.\",\"Peachtree đã tạo ra một mạng lưới đường phố và các tòa tháp nhằm mục đích trở thành trung tâm thành phố mới thân thiện với người đi bộ ở Atlanta.\",\"Theo Sennett, điều này thất bại vì các nhà thiết kế của nó đã đầu tư quá nhiều niềm tin vào thiết kế có sự hỗ trợ của máy tính để cho họ biết nó sẽ hoạt động như thế nào.\",\"Họ đã không tính đến việc các quán cà phê đường phố được xây dựng có mục đích không thể hoạt động dưới ánh nắng nóng nếu không có mái hiên bảo vệ thường thấy trong các tòa nhà cũ và thay vào đó sẽ cần điều hòa không khí tiêu tốn năng lượng, hoặc bãi đậu xe khổng lồ của nó sẽ khiến mọi người cảm thấy không được chào đón đến mức khiến mọi người không muốn ra khỏi xe.\",\"Những gì tưởng chừng như hoàn toàn có thể đoán trước và kiểm soát được trên màn ảnh lại mang lại kết quả không ngờ khi được chuyển thành hiện thực.\"]},{\"en\":[\"The same is true in transport engineering, which uses models to predict and shape the way people move through the city.\",\"Again, these models are necessary, but they are built on specific world views in which certain forms of efficiency and safety are considered and other experience of the city ignored.\",\"Designs that seem logical in models appear counter-intuitive in the actual experience of their users.\",\"The guard rails that will be familiar to anyone who has attempted to cross a British road, for example, were an engineering solution to pedestrian safety based on models that prioritise the smooth flow of traffic.\",\"On wide major roads, they often guide pedestrians to specific crossing points and slow down their progress across the road by using staggered access points divide the crossing into two – one for each carriageway.\",\"In doing so they make crossings feel longer, introducing psychological barriers greatly impacting those that are the least mobile, and encouraging others to make dangerous crossings to get around the guard rails.\",\"These barriers don’t just make it harder to cross the road: they divide communities and decrease opportunities for healthy transport.\",\"As a result, many are now being removed, causing disruption, cost, and waste.\"],\"vi\":[\"Điều này cũng đúng trong kỹ thuật vận tải, sử dụng các mô hình để dự đoán và định hình cách mọi người di chuyển trong thành phố.\",\"Một lần nữa, những mô hình này là cần thiết, nhưng chúng được xây dựng trên thế giới quan cụ thể, trong đó các hình thức hiệu quả và an toàn nhất định được xem xét và những kinh nghiệm khác của thành phố bị bỏ qua.\",\"Những thiết kế có vẻ hợp lý trong mô hình lại có vẻ phản trực giác trong trải nghiệm thực tế của người dùng.\",\"Ví dụ: các lan can bảo vệ quen thuộc với bất kỳ ai đã cố gắng băng qua đường ở Anh là một giải pháp kỹ thuật nhằm đảm bảo an toàn cho người đi bộ dựa trên các mô hình ưu tiên luồng giao thông thông suốt.\",\"Trên những con đường lớn rộng rãi, họ thường hướng dẫn người đi bộ đến các điểm giao cắt cụ thể và làm chậm quá trình băng qua đường của họ bằng cách sử dụng các điểm tiếp cận so le chia đường giao nhau thành hai – một cho mỗi làn đường.\",\"Khi làm như vậy, họ làm cho việc băng qua đường có cảm giác dài hơn, tạo ra các rào cản tâm lý ảnh hưởng lớn đến những người ít di chuyển nhất và khuyến khích những người khác thực hiện các bước băng qua nguy hiểm để đi vòng qua lan can bảo vệ.\",\"Những rào cản này không chỉ khiến việc băng qua đường trở nên khó khăn hơn mà còn gây chia rẽ cộng đồng và làm giảm cơ hội giao thông lành mạnh.\",\"Kết quả là, nhiều nơi hiện đang bị loại bỏ, gây gián đoạn, tốn kém và lãng phí.\"]},{\"en\":[\"If their designers had had the tools to think with their bodies – like dancers – and imagine how these barriers would feel, there might have been a better solution.\",\"In order to bring about fundamental changes to the ways we use our cities, engineering will need to develop a richer understanding of why people move in certain ways, and how this movement affects them.\",\"Choreography may not seem an obvious choice for tackling this problem.\",\"Yet it shares with engineering the aim of designing patterns of movement within limitations of space.\",\"It is an art form developed almost entirely by trying out ideas with the body, and gaining instant feedback on how the results feel.\",\"Choreographers have deep understanding of the psychological, aesthetic, and physical implications of different ways of moving.\"],\"vi\":[\"Nếu các nhà thiết kế của họ có công cụ để suy nghĩ bằng cơ thể của họ - giống như các vũ công - và tưởng tượng những rào cản này sẽ mang lại cảm giác như thế nào thì có lẽ đã có giải pháp tốt hơn.\",\"Để mang lại những thay đổi cơ bản trong cách chúng ta sử dụng các thành phố của mình, ngành kỹ thuật sẽ cần phát triển sự hiểu biết phong phú hơn về lý do tại sao mọi người di chuyển theo những cách nhất định và phong trào này ảnh hưởng đến họ như thế nào.\",\"Vũ đạo có vẻ không phải là một lựa chọn hiển nhiên để giải quyết vấn đề này.\",\"Tuy nhiên, nó có chung mục đích với kỹ thuật là thiết kế các mô hình chuyển động trong giới hạn không gian.\",\"Đó là một loại hình nghệ thuật được phát triển gần như hoàn toàn bằng cách thử nghiệm các ý tưởng với cơ thể và nhận được phản hồi ngay lập tức về cảm giác của kết quả.\",\"Các biên đạo múa có sự hiểu biết sâu sắc về ý nghĩa tâm lý, thẩm mỹ và thể chất của các cách di chuyển khác nhau.\"]},{\"en\":[\"Observing the choreographer Wayne McGregor, cognitive scientist David Kirsh described how he ‘thinks with the body’, Kirsh argues that by using the body to simulate outcomes, McGregor is able to imagine solutions that would not be possible using purely abstract thought.\",\"This kind of physical knowledge is valued in many areas of expertise, but currently has no place in formal engineering design processes.\",\"A suggested method for transport engineers is to improvise design solutions and instant feedback about how they would work from their own experience of them, or model designs at full scale in the way choreographers experiment with groups of dancers.\",\"Above all, perhaps, they might learn to design for emotional as well as functional effects.\"],\"vi\":[\"Quan sát biên đạo múa Wayne McGregor, nhà khoa học nhận thức David Kirsh đã mô tả cách anh ấy 'suy nghĩ bằng cơ thể', Kirsh lập luận rằng bằng cách sử dụng cơ thể để mô phỏng kết quả, McGregor có thể tưởng tượng ra các giải pháp không thể thực hiện được nếu chỉ sử dụng tư duy trừu tượng thuần túy.\",\"Loại kiến ​​thức vật lý này có giá trị trong nhiều lĩnh vực chuyên môn, nhưng hiện không có chỗ đứng trong các quy trình thiết kế kỹ thuật chính thức.\",\"Một phương pháp được đề xuất cho các kỹ sư vận tải là ứng biến các giải pháp thiết kế và phản hồi tức thì về cách họ sẽ làm việc dựa trên kinh nghiệm của chính họ hoặc thiết kế mô hình ở quy mô đầy đủ theo cách các biên đạo múa thử nghiệm với các nhóm vũ công.\",\"Trên hết, có lẽ họ có thể học cách thiết kế để mang lại hiệu quả về mặt cảm xúc cũng như chức năng.\"]}],\"timeLimit\":20,\"rawInputs\":{\"rawText\":\"The way we travel around cities has a major impact on whether they are sustainable. Transportation is estimated to account for 30% of energy consumption in most of the world’s most developed nations, so lowering the need for energy-using vehicles is essential for decreasing the environmental impact of mobility. But as more and more people move to cities, it is important to think about other kinds of sustainable travel too. The ways we travel affect our physical and mental health, our social lives, our access to work and culture, and the air we breathe. Engineers are tasked with changing how we travel round cities through urban design, but the engineering industry still works on the assumptions that led to the creation of the energy-consuming transport systems we have now: the emphasis placed solely on efficiency, speed, and quantitative data. We need radical changes, to make it healthier, more enjoyable, and less environmentally damaging to travel around cities.\\n\\nDance might hold some of the answers. That is not to suggest everyone should dance their way to work, however healthy and happy it might make us, but rather that the techniques used by choreographers to experiment with and design movement in dance could provide engineers with tools to stimulate new ideas in city-making. Richard Sennett, an influential urbanist and sociologist who has transformed ideas about the way cities are made, argues that urban design has suffered from a separation between mind and body since the introduction of the architectural blueprint.\\n\\nWhereas medieval builders improvised and adapted construction through their intimate knowledge of materials and personal experience of the conditions on a site, building designs are now conceived and stored in media technologies that detach the designer from the physical and social realities they are creating. While the design practices created by these new technologies are essential for managing the technical complexity of the modern city, they have the drawback of simplifying reality in the process.\\n\\nTo illustrate, Sennett discusses the Peachtree Center in Atlanta, USA, a development typical of the modernist approach to urban planning prevalent in the 1970s. Peachtree created a grid of streets and towers intended as a new pedestrian-friendly downtown for Atlanta. According to Sennett, this failed because its designers had invested too much faith in computer-aided design to tell them how it would operate. They failed to take into account that purpose-built street cafés could not operate in the hot sun without the protective awnings common in older buildings, and would need energy-consuming air conditioning instead, or that its giant car park would feel so unwelcoming that it would put people off getting out of their cars. What seems entirely predictable and controllable on screen has unexpected results when translated into reality.\\n\\nThe same is true in transport engineering, which uses models to predict and shape the way people move through the city. Again, these models are necessary, but they are built on specific world views in which certain forms of efficiency and safety are considered and other experience of the city ignored. Designs that seem logical in models appear counter-intuitive in the actual experience of their users. The guard rails that will be familiar to anyone who has attempted to cross a British road, for example, were an engineering solution to pedestrian safety based on models that prioritise the smooth flow of traffic. On wide major roads, they often guide pedestrians to specific crossing points and slow down their progress across the road by using staggered access points divide the crossing into two – one for each carriageway. In doing so they make crossings feel longer, introducing psychological barriers greatly impacting those that are the least mobile, and encouraging others to make dangerous crossings to get around the guard rails. These barriers don’t just make it harder to cross the road: they divide communities and decrease opportunities for healthy transport. As a result, many are now being removed, causing disruption, cost, and waste.\\n\\nIf their designers had had the tools to think with their bodies – like dancers – and imagine how these barriers would feel, there might have been a better solution. In order to bring about fundamental changes to the ways we use our cities, engineering will need to develop a richer understanding of why people move in certain ways, and how this movement affects them. Choreography may not seem an obvious choice for tackling this problem. Yet it shares with engineering the aim of designing patterns of movement within limitations of space. It is an art form developed almost entirely by trying out ideas with the body, and gaining instant feedback on how the results feel. Choreographers have deep understanding of the psychological, aesthetic, and physical implications of different ways of moving.\\n\\nObserving the choreographer Wayne McGregor, cognitive scientist David Kirsh described how he ‘thinks with the body’, Kirsh argues that by using the body to simulate outcomes, McGregor is able to imagine solutions that would not be possible using purely abstract thought. This kind of physical knowledge is valued in many areas of expertise, but currently has no place in formal engineering design processes. A suggested method for transport engineers is to improvise design solutions and instant feedback about how they would work from their own experience of them, or model designs at full scale in the way choreographers experiment with groups of dancers. Above all, perhaps, they might learn to design for emotional as well as functional effects.\\n\",\"transText\":\"Cách chúng ta di chuyển quanh các thành phố có tác động lớn đến việc liệu chúng có bền vững hay không.\\nGiao thông vận tải được ước tính chiếm 30% mức tiêu thụ năng lượng ở hầu hết các quốc gia phát triển nhất thế giới, do đó việc giảm nhu cầu sử dụng các phương tiện sử dụng năng lượng là điều cần thiết để giảm tác động môi trường của việc di chuyển.\\nNhưng khi ngày càng có nhiều người chuyển đến các thành phố, điều quan trọng là phải nghĩ đến các loại hình du lịch bền vững khác.\\nCách chúng ta đi du lịch ảnh hưởng đến sức khỏe thể chất và tinh thần, đời sống xã hội, khả năng tiếp cận công việc và văn hóa cũng như không khí chúng ta hít thở.\\nCác kỹ sư được giao nhiệm vụ thay đổi cách chúng ta di chuyển quanh các thành phố thông qua thiết kế đô thị, nhưng ngành kỹ thuật vẫn làm việc dựa trên các giả định dẫn đến việc tạo ra các hệ thống giao thông tiêu thụ năng lượng mà chúng ta hiện có: chỉ nhấn mạnh vào hiệu quả, tốc độ và dữ liệu định lượng.\\nChúng ta cần những thay đổi căn bản để làm cho việc đi lại quanh các thành phố trở nên lành mạnh hơn, thú vị hơn và ít gây hại cho môi trường hơn.\\n\\nKhiêu vũ có thể chứa một số câu trả lời.\\nĐiều đó không có nghĩa là mọi người nên nhảy theo cách của mình để đi làm, dù điều đó có thể khiến chúng ta khỏe mạnh và hạnh phúc đến đâu, mà đúng hơn là các kỹ thuật được các biên đạo múa sử dụng để thử nghiệm và thiết kế chuyển động trong khiêu vũ có thể cung cấp cho các kỹ sư những công cụ để kích thích những ý tưởng mới trong việc xây dựng thành phố.\\nRichard Sennett, một nhà đô thị học và nhà xã hội học có ảnh hưởng, người đã thay đổi ý tưởng về cách hình thành các thành phố, lập luận rằng thiết kế đô thị đã phải chịu sự tách biệt giữa tinh thần và thể xác kể từ khi bản thiết kế kiến ​​trúc được đưa ra.\\n\\nTrong khi các nhà xây dựng thời Trung cổ ứng biến và điều chỉnh việc xây dựng thông qua kiến ​​thức sâu sắc về vật liệu và kinh nghiệm cá nhân về điều kiện trên địa điểm, các thiết kế xây dựng hiện được hình thành và lưu trữ trong các công nghệ truyền thông giúp tách nhà thiết kế khỏi thực tế vật chất và xã hội mà họ đang tạo ra.\\nMặc dù các phương pháp thiết kế được tạo ra bởi các công nghệ mới này là cần thiết để quản lý sự phức tạp về mặt kỹ thuật của thành phố hiện đại, nhưng chúng có nhược điểm là đơn giản hóa thực tế trong quá trình này.\\n\\nĐể minh họa, Sennett thảo luận về Trung tâm Peachtree ở Atlanta, Hoa Kỳ, một sự phát triển điển hình của cách tiếp cận hiện đại đối với quy hoạch đô thị phổ biến vào những năm 1970.\\nPeachtree đã tạo ra một mạng lưới đường phố và các tòa tháp nhằm mục đích trở thành trung tâm thành phố mới thân thiện với người đi bộ ở Atlanta.\\nTheo Sennett, điều này thất bại vì các nhà thiết kế của nó đã đầu tư quá nhiều niềm tin vào thiết kế có sự hỗ trợ của máy tính để cho họ biết nó sẽ hoạt động như thế nào.\\nHọ đã không tính đến việc các quán cà phê đường phố được xây dựng có mục đích không thể hoạt động dưới ánh nắng nóng nếu không có mái hiên bảo vệ thường thấy trong các tòa nhà cũ và thay vào đó sẽ cần điều hòa không khí tiêu tốn năng lượng, hoặc bãi đậu xe khổng lồ của nó sẽ khiến mọi người cảm thấy không được chào đón đến mức khiến mọi người không muốn ra khỏi xe.\\nNhững gì tưởng chừng như hoàn toàn có thể đoán trước và kiểm soát được trên màn ảnh lại mang lại kết quả không ngờ khi được chuyển thành hiện thực.\\n\\nĐiều này cũng đúng trong kỹ thuật vận tải, sử dụng các mô hình để dự đoán và định hình cách mọi người di chuyển trong thành phố.\\nMột lần nữa, những mô hình này là cần thiết, nhưng chúng được xây dựng trên thế giới quan cụ thể, trong đó các hình thức hiệu quả và an toàn nhất định được xem xét và những kinh nghiệm khác của thành phố bị bỏ qua.\\nNhững thiết kế có vẻ hợp lý trong mô hình lại có vẻ phản trực giác trong trải nghiệm thực tế của người dùng.\\nVí dụ: các lan can bảo vệ quen thuộc với bất kỳ ai đã cố gắng băng qua đường ở Anh là một giải pháp kỹ thuật nhằm đảm bảo an toàn cho người đi bộ dựa trên các mô hình ưu tiên luồng giao thông thông suốt.\\nTrên những con đường lớn rộng rãi, họ thường hướng dẫn người đi bộ đến các điểm giao cắt cụ thể và làm chậm quá trình băng qua đường của họ bằng cách sử dụng các điểm tiếp cận so le chia đường giao nhau thành hai – một cho mỗi làn đường.\\nKhi làm như vậy, họ làm cho việc băng qua đường có cảm giác dài hơn, tạo ra các rào cản tâm lý ảnh hưởng lớn đến những người ít di chuyển nhất và khuyến khích những người khác thực hiện các bước băng qua nguy hiểm để đi vòng qua lan can bảo vệ.\\nNhững rào cản này không chỉ khiến việc băng qua đường trở nên khó khăn hơn mà còn gây chia rẽ cộng đồng và làm giảm cơ hội giao thông lành mạnh.\\nKết quả là, nhiều nơi hiện đang bị loại bỏ, gây gián đoạn, tốn kém và lãng phí.\\n\\nNếu các nhà thiết kế của họ có công cụ để suy nghĩ bằng cơ thể của họ - giống như các vũ công - và tưởng tượng những rào cản này sẽ mang lại cảm giác như thế nào thì có lẽ đã có giải pháp tốt hơn.\\nĐể mang lại những thay đổi cơ bản trong cách chúng ta sử dụng các thành phố của mình, ngành kỹ thuật sẽ cần phát triển sự hiểu biết phong phú hơn về lý do tại sao mọi người di chuyển theo những cách nhất định và phong trào này ảnh hưởng đến họ như thế nào.\\nVũ đạo có vẻ không phải là một lựa chọn hiển nhiên để giải quyết vấn đề này.\\nTuy nhiên, nó có chung mục đích với kỹ thuật là thiết kế các mô hình chuyển động trong giới hạn không gian.\\nĐó là một loại hình nghệ thuật được phát triển gần như hoàn toàn bằng cách thử nghiệm các ý tưởng với cơ thể và nhận được phản hồi ngay lập tức về cảm giác của kết quả.\\nCác biên đạo múa có sự hiểu biết sâu sắc về ý nghĩa tâm lý, thẩm mỹ và thể chất của các cách di chuyển khác nhau.\\n\\nQuan sát biên đạo múa Wayne McGregor, nhà khoa học nhận thức David Kirsh đã mô tả cách anh ấy 'suy nghĩ ion || \"\";\n        const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id})\">📍</button>` : \"\";\n        \n        if(q.type==='gap-fill'){\n           let t=q.text.replace(/(\\d+)[\\s:.)]*(?:[_….\\-]\\s*){2,}/g, '<span class=\"q-num\">$1</span><input type=\"text\" class=\"gap-input\" data-id=\"'+q.id+'\" oninput=\"upd('+q.id+')\">'+locBtn+'&nbsp;');\n           h+=`<div>${t}</div>`;\n        } else {\n           h+=`<div style=\"display:flex;align-items:baseline\"><span class=\"q-num\">${q.id}.</span> <span>${q.text}</span> ${locBtn}</div>`;\n           if(q.type==='mcq') q.options.forEach((o, i) => { h += `<label class=\"mcq-label\" style=\"display:block;margin:5px 0;cursor:pointer\"><input type=\"radio\" name=\"q${q.id}\" value=\"${o.trim()[0]}\" onchange=\"upd(${q.id})\"> ${o} <span id=\"mcq-mark-${q.id}-${i}\" class=\"mcq-mark\"></span></label>`; });\n           if(q.type==='tfng') {\n               h+='<div class=\"tfng-container\">';\n               ['TRUE', 'FALSE', 'NOT GIVEN'].forEach(opt => {\n                   h+=`<label class=\"tfng-label\"><input type=\"radio\" name=\"tfng${q.id}\" value=\"${opt}\" onchange=\"upd(${q.id})\"><span class=\"tfng-btn\">${opt}</span></label>`;\n               });\n               h+='</div>';\n           }\n           if(q.type==='ynng') {\n               h+='<div class=\"tfng-container\">';\n               ['YES', 'NO', 'NOT GIVEN'].forEach(opt => {\n                   h+=`<label class=\"tfng-label\"><input type=\"radio\" name=\"ynng${q.id}\" value=\"${opt}\" onchange=\"upd(${q.id})\"><span class=\"tfng-btn\">${opt}</span></label>`;\n               });\n               h+='</div>';\n           }\n           if(q.type==='mif') {\n               h+='<div class=\"mif-container\">';\n               mifRange.split('').forEach(char => {\n                   h+=`<label class=\"mif-label\"><input type=\"radio\" name=\"mif${q.id}\" value=\"${char}\" onchange=\"upd(${q.id})\"><span class=\"mif-circle\">${char}</
