ường xuyên (everlasting, enduring)\",\"synonym\":\"Poverty is a perennial problem. (Nghèo đói là vấn đề lâu năm.)\",\"example\":\"/pəˈrɛniəl/\",\"phonetic\":\"\"},{\"id\":\"v26\",\"word\":\"danger\",\"meaning\":\"nguy hiểm (risk, hazard)\",\"synonym\":\"They are in great danger. (Họ đang gặp nguy hiểm lớn.)\",\"example\":\"/ˈdeɪndʒər/\",\"phonetic\":\"\"},{\"id\":\"v27\",\"word\":\"resistance to\",\"meaning\":\"sự chống lại (opposition, immunity)\",\"synonym\":\"The bacteria show resistance to antibiotics. (Vi khuẩn có sự kháng lại kháng sinh.)\",\"example\":\"/rɪˈzɪstəns tuː/\",\"phonetic\":\"\"}],\"headings\":[],\"headingKey\":{},\"mifRange\":\"\",\"removeOpt\":true,\"removeFeatureOpt\":false,\"pairs\":[{\"eng\":\"variety\",\"vie\":\"sự đa dạng (diversity, assortment)\",\"phonetic\":\"\"},{\"eng\":\"disposes of\",\"vie\":\"loại bỏ (gets rid of, discards)\",\"phonetic\":\"\"},{\"eng\":\"swallows\",\"vie\":\"nuốt (gulps, ingests)\",\"phonetic\":\"\"},{\"eng\":\"rescue\",\"vie\":\"cứu hộ (save, recover)\",\"phonetic\":\"\"},{\"eng\":\"universal appeal\",\"vie\":\"sức hút phổ quát (global attraction, wide popularity)\",\"phonetic\":\"\"},{\"eng\":\"attributed to\",\"vie\":\"được cho là do (linked to, credited to)\",\"phonetic\":\"\"},{\"eng\":\"cautionary messages\",\"vie\":\"thông điệp cảnh báo (warnings, advisories)\",\"phonetic\":\"\"},{\"eng\":\"survival-relevant\",\"vie\":\"liên quan đến sự sống còn (life-saving, essential)\",\"phonetic\":\"\"},{\"eng\":\"prehistory\",\"vie\":\"tiền sử (ancient past, early history)\",\"phonetic\":\"\"},{\"eng\":\"incredibly ancient\",\"vie\":\"cực kỳ cổ xưa (extremely old, very ancient)\",\"phonetic\":\"\"},{\"eng\":\"devising\",\"vie\":\"sáng chế, nghĩ ra (creating, inventing)\",\"phonetic\":\"\"},{\"eng\":\"evolutionary biologists\",\"vie\":\"nhà sinh học tiến hóa (scientists of evolution)\",\"phonetic\":\"\"},{\"eng\":\"characteristics\",\"vie\":\"đặc điểm (features, traits)\",\"phonetic\":\"\"},{\"eng\":\"variants\",\"vie\":\"biến thể (versions, alternatives)\",\"phonetic\":\"\"},{\"eng\":\"oral traditions\",\"vie\":\"truyền thống truyền miệng (spoken heritage, folklore)\",\"phonetic\":\"\"},{\"eng\":\"altered\",\"vie\":\"bị thay đổi (changed, modified)\",\"phonetic\":\"\"},{\"eng\":\"assumptions\",\"vie\":\"giả định (beliefs, suppositions)\",\"phonetic\":\"\"},{\"eng\":\"central\",\"vie\":\"trung tâm, quan trọng (main, essential)\",\"phonetic\":\"\"},{\"eng\":\"in disguise\",\"vie\":\"cải trang, ngụy trang (hidden, masked)\",\"phonetic\":\"\"},{\"eng\":\"crucial\",\"vie\":\"quan trọng, cốt yếu (vital, critical)\",\"phonetic\":\"\"},{\"eng\":\"conserved\",\"vie\":\"được bảo tồn (preserved, maintained)\",\"phonetic\":\"\"},{\"eng\":\"flexible\",\"vie\":\"linh hoạt (adaptable, versatile)\",\"phonetic\":\"\"},{\"eng\":\"trivial\",\"vie\":\"tầm thường, nhỏ nhặt (insignificant, minor)\",\"phonetic\":\"\"},{\"eng\":\"unconvinced\",\"vie\":\"không bị thuyết phục (skeptical, doubtful)\",\"phonetic\":\"\"},{\"eng\":\"gruesome\",\"vie\":\"kinh khủng, ghê rợn (horrific, dreadful)\",\"phonetic\":\"\"},{\"eng\":\"perennial\",\"vie\":\"lâu năm, thường xuyên (everlasting, enduring)\",\"phonetic\":\"\"},{\"eng\":\"danger\",\"vie\":\"nguy hiểm (risk, hazard)\",\"phonetic\":\"\"},{\"eng\":\"resistance to\",\"vie\":\"sự chống lại (opposition, immunity)\",\"phonetic\":\"\"}],\"pData\":[{\"en\":[\"People of every culture tell each other fairy tales but the same story often takes a variety of forms in different parts of the world.\",\"In the story of Little Red Riding Hood that European children are familiar with, a young girl on the way to see her grandmother meets a wolf and tells him where she is going.\",\"The wolf runs on ahead and disposes of the grandmother, then gets into bed dressed in the grandmother’s clothes to wait for Little Red Riding Hood.\",\"You may think you know the story – but which version?\",\"In some versions, the wolf swallows up the grandmother, while in others it locks her in a cupboard.\",\"In some stories Red Riding Hood gets the better of the wolf on her own, while in others a hunter or a woodcutter hears her cries and comes to her rescue.\"],\"vi\":[\"Mọi người thuộc mọi nền văn hóa đều kể cho nhau nghe những câu chuyện cổ tích nhưng cùng một câu chuyện thường có nhiều hình thức khác nhau ở những nơi khác nhau trên thế giới.\",\"Trong câu chuyện Cô bé quàng khăn đỏ mà trẻ em châu Âu quen thuộc, một cô bé trên đường đi gặp bà ngoại đã gặp một con sói và báo cho nó biết cô sắp đi đâu.\",\"Sói chạy trước đuổi bà ngoại rồi mặc quần áo của bà ngoại lên giường chờ Cô bé quàng khăn đỏ.\",\"Bạn có thể nghĩ rằng bạn biết câu chuyện – nhưng phiên bản nào?\",\"Trong một số phiên bản, con sói nuốt chửng bà nội, trong khi ở những phiên bản khác, nó nhốt bà vào tủ.\",\"Trong một số câu chuyện, Cô bé quàng khăn đỏ đã tự mình chiến thắng con sói, trong khi ở những câu chuyện khác, một thợ săn hoặc tiều phu nghe thấy tiếng kêu của cô và đến giải cứu cô.\"]},{\"en\":[\"The universal appeal of these tales is frequently attributed to the idea that they contain cautionary messages: in the case of Little Red Riding Hood, to listen to your mother, and avoid talking to strangers. ‘It might be what we find interesting about this story is that it’s got this survival-relevant information in it,’ says anthropologist Jamie Tehrani at Durham University in the UK.\",\"But his research suggests otherwise. ‘We have this huge gap in our knowledge about the history and prehistory of storytelling, despite the fact that we know this genre is an incredibly ancient one,’ he says.\",\"That hasn’t stopped anthropologists, folklorists* and other academics devising theories to explain the importance of fairy tales in human society.\",\"Now Tehrani has found a way to test these ideas, borrowing a technique from evolutionary biologists.\"],\"vi\":[\"Sức hấp dẫn chung của những câu chuyện này thường là do ý tưởng rằng chúng chứa đựng những thông điệp cảnh báo: trong trường hợp Cô bé quàng khăn đỏ, hãy nghe lời mẹ và tránh nói chuyện với người lạ. Nhà nhân chủng học Jamie Tehrani tại Đại học Durham ở Anh cho biết: “Điều chúng tôi thấy thú vị về câu chuyện này là nó chứa thông tin liên quan đến sự sống còn trong đó”.\",\"Nhưng nghiên cứu của ông cho thấy điều ngược lại. Ông nói: “Chúng ta có khoảng cách lớn về kiến ​​thức về lịch sử và tiền sử của việc kể chuyện, mặc dù thực tế là chúng ta biết thể loại này là một thể loại cực kỳ cổ xưa”.\",\"Điều đó không ngăn cản các nhà nhân chủng học, nhà nghiên cứu văn học dân gian* và các học giả khác nghĩ ra các lý thuyết để giải thích tầm quan trọng của truyện cổ tích trong xã hội loài người.\",\"Bây giờ Tehrani đã tìm ra cách để kiểm tra những ý tưởng này bằng cách mượn một kỹ thuật từ các nhà sinh học tiến hóa.\"]},{\"en\":[\"To work out the evolutionary history, development and relationships among groups of organisms, biologists compare the characteristics of living species in a process called ‘phylogenetic analysis’.\",\"Tehrani has used the same approach to compare related versions of fairy tales to discover how they have evolved and which elements have survived longest.\"],\"vi\":[\"Để tìm ra lịch sử tiến hóa, sự phát triển và mối quan hệ giữa các nhóm sinh vật, các nhà sinh học so sánh các đặc điểm của các loài sống trong một quá trình gọi là 'phân tích phát sinh loài'.\",\"Tehrani đã sử dụng cách tiếp cận tương tự để so sánh các phiên bản liên quan của truyện cổ tích nhằm khám phá xem chúng đã phát triển như thế nào và yếu tố nào tồn tại lâu nhất.\"]},{\"en\":[\"Tehrani’s analysis focused on Little Red Riding Hood in its many forms, which include another Western fairy tale known as The Wolf and the Kids.\",\"Checking for variants of these two tales and similar stories from Africa, East Asia and other regions, he ended up with 58 stories recorded from oral traditions.\",\"Once his phylogenetic analysis had established that they were indeed related, he used the same methods to explore how they have developed and altered over time.\"],\"vi\":[\"Phân tích của Tehrani tập trung vào Cô bé quàng khăn đỏ dưới nhiều hình thức, trong đó bao gồm một câu chuyện cổ tích phương Tây khác có tên The Wolf and the Kids.\",\"Kiểm tra các biến thể của hai câu chuyện này và những câu chuyện tương tự từ Châu Phi, Đông Á và các khu vực khác, ông đã kết thúc với 58 câu chuyện được ghi lại từ truyền thống truyền miệng.\",\"Sau khi phân tích phát sinh loài của ông đã chứng minh rằng chúng thực sự có liên quan với nhau, ông đã sử dụng các phương pháp tương tự để khám phá cách chúng phát triển và thay đổi theo thời gian.\"]},{\"en\":[\"First he tested some assumptions about which aspects of the story alter least as it evolves, indicating their importance.\",\"Folklorists believe that what happens in a story is more central to the story than the characters in it – that visiting a relative, only to be met by a scary animal in disguise, is more fundamental than whether the visitor is a little girl or three siblings, or the animal is a tiger instead of a wolf.\"],\"vi\":[\"Đầu tiên, anh ấy kiểm tra một số giả định về khía cạnh nào của câu chuyện ít thay đổi nhất khi nó phát triển, cho thấy tầm quan trọng của chúng.\",\"Các nhà văn học dân gian tin rằng những gì xảy ra trong một câu chuyện có tính chất trọng tâm của câu chuyện hơn là các nhân vật trong đó - việc đến thăm một người họ hàng, chỉ để gặp một con vật đáng sợ cải trang, quan trọng hơn việc người khách là một bé gái hay ba anh chị em, hay con vật đó là một con hổ thay vì một con sói.\"]},{\"en\":[\"However, Tehrani found no significant difference in the rate of evolution of incidents compared with that of characters. ‘Certain episodes are very stable because they are crucial to the story, but there are lots of other details that can evolve quite freely,’ he says.\",\"Neither did his analysis support the theory that the central section of a story is the most conserved part.\",\"He found no significant difference in the flexibility of events there compared with the beginning or the end.\"],\"vi\":[\"Tuy nhiên, Tehrani không tìm thấy sự khác biệt đáng kể nào về tốc độ diễn biến của các sự cố so với tốc độ diễn biến của các nhân vật. Ông nói: “Một số tình tiết rất ổn định vì chúng rất quan trọng đối với câu chuyện, nhưng có rất nhiều chi tiết khác có thể diễn biến khá tự do”.\",\"Phân tích của ông cũng không ủng hộ lý thuyết cho rằng phần trung tâm của câu chuyện là phần được bảo tồn nhiều nhất.\",\"Ông không tìm thấy sự khác biệt đáng kể nào về tính linh hoạt của các sự kiện ở đó so với lúc bắt đầu hoặc lúc kết thúc.\"]},{\"en\":[\"But the really big surprise came when he looked at the cautionary elements of the story. ‘Studies on hunter-gatherer folk tales suggest that these narratives include really important information about the environment and the possible dangers that may be faced there – stuff that’s relevant to survival,’ he says.\",\"Yet in his analysis such elements were just as flexible as seemingly trivial details.\",\"What, then, is important enough to be reproduced from generation to generation?\"],\"vi\":[\"Nhưng điều ngạc nhiên thực sự lớn đã đến khi anh nhìn vào những yếu tố cảnh báo của câu chuyện. Ông nói: “Các nghiên cứu về những câu chuyện dân gian về săn bắn hái lượm cho thấy rằng những câu chuyện kể này bao gồm những thông tin thực sự quan trọng về môi trường và những mối nguy hiểm có thể gặp phải ở đó – những thứ liên quan đến sự sống còn”.\",\"Tuy nhiên, trong phân tích của ông, những yếu tố như vậy cũng linh hoạt như những chi tiết tưởng chừng như tầm thường.\",\"Vậy thì điều gì đủ quan trọng để được tái tạo từ thế hệ này sang thế hệ khác?\"]},{\"en\":[\"The answer, it would appear, is fear – blood-thirsty and gruesome aspects of the story, such as the eating of the grandmother by the wolf, turned out to be the best preserved of all.\",\"Why are these details retained by generations of storytellers, when other features are not?\",\"Tehrani has an idea: ‘In an oral context, a story won’t survive because of one great teller.\",\"It also needs to be interesting when it’s told by someone who’s not necessarily a great storyteller.’ Maybe being swallowed whole by a wolf, then cut out of its stomach alive is so gripping that it helps the story remain popular, no matter how badly it’s told.\"],\"vi\":[\"Có vẻ như câu trả lời là nỗi sợ hãi - những khía cạnh khát máu và khủng khiếp của câu chuyện, chẳng hạn như việc bị sói ăn thịt bà ngoại, hóa ra lại được bảo tồn tốt nhất.\",\"Tại sao những chi tiết này được nhiều thế hệ người kể chuyện giữ lại, trong khi những đặc điểm khác thì không?\",\"Tehrani có một ý tưởng: ‘Trong bối cảnh truyền miệng, một câu chuyện sẽ không tồn tại nếu chỉ có một người kể chuyện vĩ đại.\",\"Nó cũng cần phải thú vị khi được kể bởi một người không nhất thiết phải là một người kể chuyện giỏi.’ Có thể bị một con sói nuốt chửng toàn bộ, sau đó mổ bụng nó sống sẽ hấp dẫn đến mức giúp câu chuyện vẫn được yêu thích, bất kể nó được kể tệ đến mức nào.\"]},{\"en\":[\"Jack Zipes at the University of Minnesota, Minneapolis, is unconvinced by Tehrani’s views on fairy tales. ‘Even if they’re gruesome, they won’t stick unless they matter,’ he says.\",\"He believes the perennial theme of women as victims in stories like Little Red Riding Hood explains why they continue to feel relevant.\",\"But Tehrani points out that although this is often the case in Western versions, it is not always true elsewhere.\",\"In Chinese and Japanese versions, often known as The Tiger Grandmother, the villain is a woman, and in both Iran and Nigeria, the victim is a boy.\"],\"vi\":[\"Jack Zipes tại Đại học Minnesota, Minneapolis, không bị thuyết phục bởi quan điểm của Tehrani về truyện cổ tích. Ông nói: “Ngay cả khi chúng khủng khiếp, chúng sẽ không dính vào nhau trừ khi chúng quan trọng”.\",\"Anh ấy tin rằng chủ đề lâu năm về việc phụ nữ là nạn nhân trong những câu chuyện như Cô bé quàng khăn đỏ giải thích lý do tại sao họ tiếp tục cảm thấy có liên quan.\",\"Nhưng Tehrani chỉ ra rằng mặc dù điều này thường đúng với các phiên bản phương Tây nhưng không phải lúc nào cũng đúng ở những nơi khác.\",\"Trong phiên bản Trung Quốc và Nhật Bản, thường được gọi là Bà ngoại hổ, nhân vật phản diện là một phụ nữ, còn ở cả Iran và Nigeria, nạn nhân là một cậu bé.\"]},{\"en\":[\"Mathias Clasen at Aarhus University in Denmark isn’t surprised by Tehrani’s findings. ‘Habits and morals change, but the things that scare us, and the fact that we seek out entertainment that’s designed to scare us – those are constant,’ he says.\",\"Clasen believes that scary stories teach us what it feels like to be afraid without having to experience real danger, and so build up resistance to negative emotions.\"],\"vi\":[\"Mathias Clasen tại Đại học Aarhus ở Đan Mạch không ngạc nhiên trước phát hiện của Tehrani. Ông nói: “Thói quen và đạo đức thay đổi, nhưng những điều khiến chúng ta sợ hãi và việc chúng ta tìm kiếm những trò giải trí được thiết kế để khiến chúng ta sợ hãi – đó là những điều không đổi”.\",\"Clasen tin rằng những câu chuyện đáng sợ dạy chúng ta cảm giác sợ hãi khi không phải trải qua mối nguy hiểm thực sự, và do đó hình thành khả năng chống lại những cảm xúc tiêu cực.\"]}],\"timeLimit\":20,\"rawInputs\":{\"rawText\":\"People of every culture tell each other fairy tales but the same story often takes a variety of forms in different parts of the world. In the story of Little Red Riding Hood that European children are familiar with, a young girl on the way to see her grandmother meets a wolf and tells him where she is going. The wolf runs on ahead and disposes of the grandmother, then gets into bed dressed in the grandmother’s clothes to wait for Little Red Riding Hood. You may think you know the story – but which version? In some versions, the wolf swallows up the grandmother, while in others it locks her in a cupboard. In some stories Red Riding Hood gets the better of the wolf on her own, while in others a hunter or a woodcutter hears her cries and comes to her rescue.\\n\\nThe universal appeal of these tales is frequently attributed to the idea that they contain cautionary messages: in the case of Little Red Riding Hood, to listen to your mother, and avoid talking to strangers. ‘It might be what we find interesting about this story is that it’s got this survival-relevant information in it,’ says anthropologist Jamie Tehrani at Durham University in the UK. But his research suggests otherwise. ‘We have this huge gap in our knowledge about the history and prehistory of storytelling, despite the fact that we know this genre is an incredibly ancient one,’ he says. That hasn’t stopped anthropologists, folklorists* and other academics devising theories to explain the importance of fairy tales in human society. Now Tehrani has found a way to test these ideas, borrowing a technique from evolutionary biologists.\\n\\nTo work out the evolutionary history, development and relationships among groups of organisms, biologists compare the characteristics of living species in a process called ‘phylogenetic analysis’. Tehrani has used the same approach to compare related versions of fairy tales to discover how they have evolved and which elements have survived longest.\\n\\nTehrani’s analysis focused on Little Red Riding Hood in its many forms, which include another Western fairy tale known as The Wolf and the Kids. Checking for variants of these two tales and similar stories from Africa, East Asia and other regions, he ended up with 58 stories recorded from oral traditions. Once his phylogenetic analysis had established that they were indeed related, he used the same methods to explore how they have developed and altered over time.\\n\\nFirst he tested some assumptions about which aspects of the story alter least as it evolves, indicating their importance. Folklorists believe that what happens in a story is more central to the story than the characters in it – that visiting a relative, only to be met by a scary animal in disguise, is more fundamental than whether the visitor is a little girl or three siblings, or the animal is a tiger instead of a wolf.\\n\\nHowever, Tehrani found no significant difference in the rate of evolution of incidents compared with that of characters. ‘Certain episodes are very stable because they are crucial to the story, but there are lots of other details that can evolve quite freely,’ he says. Neither did his analysis support the theory that the central section of a story is the most conserved part. He found no significant difference in the flexibility of events there compared with the beginning or the end.\\n\\nBut the really big surprise came when he looked at the cautionary elements of the story. ‘Studies on hunter-gatherer folk tales suggest that these narratives include really important information about the environment and the possible dangers that may be faced there – stuff that’s relevant to survival,’ he says. Yet in his analysis such elements were just as flexible as seemingly trivial details. What, then, is important enough to be reproduced from generation to generation?\\n\\nThe answer, it would appear, is fear – blood-thirsty and gruesome aspects of the story, such as the eating of the grandmother by the wolf, turned out to be the best preserved of all. Why are these details retained by generations of storytellers, when other features are not? Tehrani has an idea: ‘In an oral context, a story won’t survive because of one great teller. It also needs to be interesting when it’s told by someone who’s not necessarily a great storyteller.’ Maybe being swallowed whole by a wolf, then cut out of its stomach alive is so gripping that it helps the story remain popular, no matter how badly it’s told.\\n\\nJack Zipes at the University of Minnesota, Minneapolis, is unconvinced by Tehrani’s views on fairy tales. ‘Even if they’re gruesome, they won’t stick unless they matter,’ he says. He believes the perennial theme of women as victims in stories like Little Red Riding Hood explains why they continue to feel relevant. But Tehrani points out that although this is often the case in Western versions, it is not always true elsewhere. In Chinese and Japanese versions, often known as The Tiger Grandmother, the villain is a woman, and in both Iran and Nigeria, the victim is a boy.\\n\\nMathias Clasen at Aarhus University in Denmark isn’t surprised by Tehrani’s findings. ‘Habits and morals change, but the things that scare us, and the fact that we seek out entertainment that’s designed to scare us – those are constant,’ he says. Clasen believes that scary stories teach us what it feels like to be afraid without having to experience real danger, and so build up resistance to negative emotions.\",\"transText\":\"Mọi người thuộc mọi nền văn hóa đều kể cho nhau nghe những câu chuyện cổ tích nhưng cùng một câu chuyện thường có nhiều hình thức khác nhau ở những nơi khác nhau trên thế giới.\\nTrong câu chuyện Cô bé quàng khăn đỏ mà trẻ em châu Âu quen thuộc, một cô bé trên đường đi gặp bà ngoại đã gặp một con sói và báo cho nó biết cô sắp đi đâu.\\nSói chạy trước đuổi bà ngoại rồi mặc quần áo của bà ngoại lên giường chờ Cô bé quàng khăn đỏ.\\nBạn có thể nghĩ rằng bạn biết câu chuyện – nhưng phiên bản nào?\\nTrong một số phiên bản, con sói nuốt chửng bà nội, trong khi ở những phiên bản khác, nó nhốt bà vào tủ.\\nTrong một số câu chuyện, Cô bé quàng khăn đỏ đã tự mình chiến thắng con sói, trong khi ở những câu chuyện khác, một thợ săn hoặc tiều phu nghe thấy tiếng kêu của cô và đến giải cứu cô.\\n\\nSức hấp dẫn chung của những câu chuyện này thường là do ý tưởng rằng chúng chứa đựng những thông điệp cảnh báo: trong trường hợp Cô bé quàng khăn đỏ, hãy nghe lời mẹ và tránh nói chuyện với người lạ. Nhà nhân chủng học Jamie Tehrani tại Đại học Durham ở Anh cho biết: “Điều chúng tôi thấy thú vị về câu chuyện này là nó chứa thông tin liên quan đến sự sống còn trong đó”.\\nNhưng nghiên cứu của ông cho thấy điều ngược lại. Ông nói: “Chúng ta có khoảng cách lớn về kiến ​​thức về lịch sử và tiền sử của việc kể chuyện, mặc dù thực tế là chúng ta biết thể loại này là một thể loại cực kỳ cổ xưa”.\\nĐiều đó không ngăn cản các nhà nhân chủng học, nhà nghiên cứu văn học dân gian* và các học giả khác nghĩ ra các lý thuyết để giải thích tầm quan trọng của truyện cổ tích trong xã hội loài người.\\nBây giờ Tehrani đã tìm ra cách để kiểm tra những ý tưởng này bằng cách mượn một kỹ thuật từ các nhà sinh học tiến hóa.\\n\\nĐể tìm ra lịch sử tiến hóa, sự phát triển và mối quan hệ giữa các nhóm sinh vật, các nhà sinh học so sánh các đặc điểm của các loài sống trong một quá trình gọi là 'phân tích phát sinh loài'.\\nTehrani đã sử dụng cách tiếp cận tương tự để so sánh các phiên bản liên quan của truyện cổ tích nhằm khám phá xem chúng đã phát triển như thế nào và yếu tố nào tồn tại lâu nhất.\\n\\nPhân tích của Tehrani tập trung vào Cô bé quàng khăn đỏ dưới nhiều hình thức, trong đó bao gồm một câu chuyện cổ tích phương Tây khác có tên The Wolf and the Kids.\\nKiểm tra các biến thể của hai câu chuyện này và những câu chuyện tương tự từ Châu Phi, Đông Á và các khu vực khác, ông đã kết thúc với 58 câu chuyện được ghi lại từ truyền thống truyền miệng.\\nSau khi phân tích phát sinh loài của ông đã chứng minh rằng chúng thực sự có liên quan với nhau, ông đã sử dụng các phương pháp tương tự để khám phá cách chúng phát triển và thay đổi theo thời gian.\\n\\nĐầu tiên, anh ấy kiểm tra một số giả định về khía cạnh nào của câu chuyện ít thay đổi nhất khi nó phát triển, cho thấy tầm quan trọng của chúng.\\nCác nhà văn học dân gian tin rằng những gì xảy ra trong một câu chuyện có tính chất trọng tâm của câu chuyện hơn là các nhân vật trong đó - việc đến thăm một người họ hàng, chỉ để gặp một con vật đáng sợ cải trang, quan trọng hơn việc người khách là một bé gái hay ba anh chị em, hay con vật đó là một con hổ thay vì một con sói.\\n\\nTuy nhiên, Tehrani không tìm thấy sự khác biệt đáng kể nào về tốc độ diễn biến của các sự cố so với tốc độ diễn biến của các nhân vật. Ông nói: “Một số tình tiết rất ổn định vì chúng rất quan trọng đối với câu chuyện, nhưng có rất nhiều chi tiết khác có thể diễn biến khá tự do”.\\nPhân tích của ông cũng không ủng hộ lý thuyết cho rằng phần trung tâm của câu chuyện là phần được bảo tồn nhiều nhất.\\nÔng không tìm thấy sự khác biệt đáng kể nào về tính linh hoạt của các sự kiện ở đó so với lúc bắt đầu hoặc lúc kết thúc.\\n\\nNhưng điều ngạc nhiên thực sự lớn đã đến khi anh nhìn vào những yếu tố cảnh báo của câu chuyện. Ông nói: “Các nghiên cứu về những câu chuyện dân gian về săn bắn hái lượm cho thấy rằng những câu chuyện kể này bao gồm những thông tin thực sự quan trọng về môi trường và những mối nguy hiểm có thể gặp phải ở đó – những thứ liên quan đến sự sống còn”.\\nTuy nhiên, trong phân tích của ông, những yếu tố như vậy cũng linh hoạt như những chi tiết tưởng chừng như tầm thường.\\nVậy thì điều gì đủ quan trọng để được tái tạo từ thế hệ này sang thế hệ khác?\\n\\nCó vẻ như câu trả lời là nỗi sợ hãi - những khía cạnh khát máu và khủng khiếp của câu chuyện, chẳng hạn như việc bị sói ăn thịt bà ngoại, hóa ra lại được bảo tồn tốt nhất.\\nTại sao những chi tiết này được nhiều thế hệ người kể chuyện giữ lại, trong khi những đặc điểm khác thì không?\\nTehrani có một ý tưởng: ‘Trong bối cảnh truyền miệng, một câu chuyện sẽ không tồn tại nếu chỉ có một người kể chuyện vĩ đại.\\nNó cũng cần phải thú vị khi được kể bởi một người không nhất thiết phải là một người kể chuyện giỏi.’ Có thể bị một con sói nuốt chửng toàn bộ, sau đó mổ bụng nó sống sẽ hấp dẫn đến mức giúp câu chuyện vẫn được yêu thích, bất kể nó được kể tệ đến mức nào.\\n\\nJack Zipes tại Đại học Minnesota, Minneapolis, không bị thuyết phục bởi quan điểm của Tehrani về truyện cổ tích. Ông nói: “Ngay cả khi chúng khủng khiếp, chúng sẽ không dính vào nhau trừ khi chúng quan trọng”.\\nAnh ấy tin rằng chủ đề lâu năm về việc phụ nữ là nạn nhân trong những câu chuyện như Cô bé quàng khăn đỏ giải thích lý do tại sao họ tiếp tục cảm thấy có liên quan.\\nNhưng Tehrani chỉ ra rằng mặc dù điều này thường đúng với các phiên bản phương Tây nhưng không phải lúc nào cũng đúng ở những nơi khác.\\nTrong phiên bản Trung Quốc và Nhật Bản, thường được gọi là Bà ngoại hổ, nhân vật phản diện là một phụ nữ, còn ở cả Iran và Nigeria, nạn nhân là một cậu bé.\\n\\nMathias Clasen tại Đại học Aarhus ở Đan Mạch không ngạc nhiên trước phát hiện của Tehrani. Ông nói: “Thói quen và đạo đức thay đổi, nhưng những điều khiến chúng ta sợ hãi và việc chúng ta tìm kiếm những trò giải trí được thiết kế để khiến chúng ta sợ hãi – đó là những điều không đổi”.\\nClasen tin rằng những câu chuyện đáng sợ dạy chúng ta cảm giác sợ hãi khi không phải trải qua mối nguy hiểm thực sự, và do đó hình thành khả năng chống lại những cảm xúc tiêu cực.\\n\",\"excelInput\":\"sự đa dạng (diversity, assortment)\\tThe shop offers a wide variety of fruits. (Cửa hàng cung cấp nhiều loại trái cây đa dạng.)\\t/vəˈraɪəti/\\nloại bỏ (gets rid of, discards)\\tHe disposes of old clothes. (Anh ấy loại bỏ quần áo cũ.)\\t/dɪsˈpoʊzɪz əv/\\nnuốt (gulps, ingests)\\tShe swallows the pill easily. (Cô ấy nuốt viên thuốc dễ dàng.)\\t/ˈswɒloʊz/\\ncứu hộ (save, recover)\\tFirefighters rescue people from danger. (Lính cứu hỏa cứu người khỏi nguy hiểm.)\\t/ˈrɛskjuː/\\nsức hút phổ quát (global attraction, wide popularity)\\tThe movie has universal appeal. (Bộ phim có sức hút phổ quát.)\\t/ˌjuːnɪˈvɜːrsəl əˈpiːl/\\nđược cho là do (linked to, credited to)\\tHis success is attributed to hard work. (Thành công của anh ấy được cho là do chăm chỉ.)\\t/əˈtrɪbjʊtɪd tuː/\\nthông điệp cảnh báo (warnings, advisories)\\tFairy tales often carry cautionary messages. (Truyện cổ tích thường mang thông điệp cảnh báo.)\\t/ˈkɔːʃənɛri ˈmɛsɪʤɪz/\\nliên quan đến sự sống còn (life-saving, essential)\\tFood and water are survival-relevant needs. (Thức ăn và nước là nhu cầu liên quan đến sự sống còn.)\\t/sərˈvaɪvl ˈrɛləvənt/\\ntiền sử (ancient past, early history)\\tTools from prehistory were found. (Công cụ từ thời tiền sử được tìm thấy.)\\t/ˈpriːˌhɪstəri/\\ncực kỳ cổ xưa (extremely old, very ancient)\\tThe fossils are incredibly ancient. (Hóa thạch cực kỳ cổ xưa.)\\t/ɪnˈkrɛdəbli ˈeɪnʃənt/\\nsáng chế, nghĩ ra (creating, inventing)\\tHe is devising a new plan. (Anh ấy đang nghĩ ra một kế hoạch mới.)\\t/dɪˈvaɪzɪŋ/\\nnhà sinh học tiến hóa (scientists of evolution)\\tEvolutionary biologists study species development. (Các nhà sinh học tiến hóa nghiên cứu sự phát triển loài.)\\t/ˌɛvəˈluːʃəˌnɛri baɪˈɒlədʒɪsts/\\nđặc điểm (features, traits)\\tThe study shows human characteristics. (Nghiên cứu cho thấy đặc điểm của con người.)\\t/ˌkærəktəˈrɪstɪks/\\nbiến thể (versions, alternatives)\\tThe virus has many variants. (Virus có nhiều biến thể.)\\t/ˈvɛriənts/\\ntruyền thống truyền miệng (spoken heritage, folklore)\\tLegends are passed down through oral traditions. (Truyền thuyết được truyền qua truyền thống truyền miệng.)\\t/ˈɔːrəl trəˈdɪʃənz/\\nbị thay đổi (changed, modified)\\tThe plan was altered at the last minute. (Kế hoạch bị thay đổi vào phút cuối.)\\t/ˈɔːltərd/\\ngiả định (beliefs, suppositions)\\tHis theory is based on false assumptions. (Lý thuyết của anh ấy dựa trên giả định sai lầm.)\\t/əˈsʌmpʃənz/\\ntrung tâm, quan trọng (main, essential)\\tEducation plays a central role in society. (Giáo dục đóng vai trò trung tâm trong xã hội.)\\t/ˈsɛntrəl/\\ncải trang, ngụy trang (hidden, masked)\\tThe spy entered in disguise. (Điệp viên vào trong cải trang.)\\t/ɪn dɪsˈɡaɪz/\\nquan trọng, cốt yếu (vital, critical)\\tWater is crucial for survival. (Nước rất quan trọng cho sự sống còn.)\\t/ˈkruːʃəl/\\nđược bảo tồn (preserved, maintained)\\tThe paintings were carefully conserved. (Những bức tranh được bảo tồn cẩn thận.)\\t/kənˈsɜːrvd/\\nlinh hoạt (adaptable, versatile)\\tShe has a flexible schedule. (Cô ấy có lịch trình linh hoạt.)\\t/ˈflɛksəbl/\\ntầm thường, nhỏ nhặt (insignificant, minor)\\tThe argument was over a trivial matter. (Cuộc tranh cãi là về chuyện nhỏ nhặt.)\\t/ˈtrɪviəl/\\nkhông bị thuyết phục (skeptical, doubtful)\\tHe remained unconvinced by the evidence. (Anh ấy vẫn không bị thuyết phục bởi bằng chứng.)\\t/ˌʌnkənˈvɪnst/\\nkinh khủng, ghê rợn (horrific, dreadful)\\tThe movie showed gruesome scenes. (Bộ phim có những cảnh ghê rợn.)\\t/ˈɡruːsəm/\\nlâu năm, thường xuyên (everlasting, enduring)\\tPoverty is a perennial problem. (Nghèo đói là vấn đề lâu năm.)\\t/pəˈrɛniəl/\\nnguy hiểm (risk, hazard)\\tThey are in great danger. (Họ đang gặp nguy hiểm lớn.)\\t/ˈdeɪndʒər/\\nsự chống lại (opposition, immunity)\\tThe bacteria show resistance to antibiotics. (Vi khuẩn có sự kháng lại kháng sinh.)\\t/rɪˈzɪstəns tuː/\",\"txtHeadingsList\":\"\",\"mifOptions\":\"\",\"txtTfngMifList\":\"\",\"txtMatchFeature\":\"\",\"rawQuestions\":\"37   What method did Jamie Tehrani use to test his ideas about fairy tales?\\nA   He compared oral and written forms of the same stories.\\nB   He looked at many different forms of the same basic story.\\nC   He looked at unrelated stories from many different countries.\\nD   He contrasted the development of fairy tales with that of living creatures.\\n38   When discussing Tehrani’s views, Jack Zipes suggests that\\nA   Tehrani ignores key changes in the role of women.\\nB   stories which are too horrific are not always taken seriously.\\nC   Tehrani overemphasises the importance of violence in stories.\\nD   features of stories only survive if they have a deeper significance.\\n39   Why does Tehrani refer to Chinese and Japanese fairy tales?\\nA   to indicate that Jack Zipes’ theory is incorrect\\nB   to suggest that crime is a global problem\\nC   to imply that all fairy tales have a similar meaning\\nD   to add more evidence for Jack Zipes’ ideas\\n40   What does Mathias Clasen believe about fairy tales?\\nA   They are a safe way of learning to deal with fear.\\nB   They are a type of entertainment that some people avoid.\\nC   They reflect the changing values of our society.\\nD   They reduce our ability to deal with real-world problems.\\n\\n\\nComplete the summary using the list of words, \\u003cb>\\u003cb>A-I\\u003c/b>\\u003c/b>, below.\\nWrite the correct letter, \\u003cb>\\u003cb>A-I\\u003c/b>\\u003c/b>, in boxes 32-36 on your answer sheet.\\n\\u003cb>\\u003cb>Phylogenetic analysis of Little Red Riding Hood\\u003c/b>\\u003c/b>\\nTehrani used techniques from evolutionary biology to find out if 32………………….. existed among 58 stories from around the world. He also wanted to know which aspects of the stories had fewest 33…………………., as he believed these aspects would be the most important ones. Contrary to other beliefs, he found that some 34……………………. that were included in a story tended to change over time, and that the middle of a story seemed no more important than the other parts. He was also surprised that parts of a story which seemed to provide some sort of 35…………………. were unimportant. The aspect that he found most important in a story’s survival was 36…………………\\nA.     ending                  \\nB.     events                  \\nC.     warning\\nD.     links                      \\nE.     records                 \\nF.     variations\\nG.     horror                   \\nH.     people                \\nI.     plot\\n\",\"bulkKeyInput\":\"32. D\\n\\n33. F\\n\\n34. B\\n\\n35. C\\n\\n36. G\\n\\n37. B\\n\\n38. D\\n\\n39. A\\n\\n40. A\",\"timeLimitInput\":\"20\",\"chkMatchHeadings\":false,\"chkRemoveOpt\":true,\"chkTfngMif\":false,\"chkMatchFeature\":false,\"chkRemoveFeatureOpt\":false}}];\n\nlet currentLessonIndex = 0;\nlet qs, vocab, headings, headingKey, mifRange, removeOpt, removeFeatureOpt, pairs, pData;\n\nlet timeLeft = 0;\nlet timerInterval;\nconst timerEl = document.getElementById('timer');\n\nfunction startTimer() {\n    timerInterval = setInterval(() => {\n        if(timeLeft <= 0) {\n            clearInterval(timerInterval);\n            timerEl.innerText = \"00:00\";\n            alert(\"Time is up!\");\n            return;\n        }\n        timeLeft--;\n        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');\n        const s = (timeLeft % 60).toString().padStart(2, '0');\n        timerEl.innerText = `${m}:${s}`;\n    }, 1000);\n}\n\nfunction switchLesson(idx) {\n    currentLessonIndex = parseInt(idx);\n    const l = lessonsData[currentLessonIndex];\n    qs = l.qs; vocab = l.vocab; headings = l.headings; headingKey = l.headingKey;\n    mifRange = l.mifRange; removeOpt = l.removeOpt; removeFeatureOpt = l.removeFeatureOpt;\n    pairs = l.pairs; pData = l.pData;\n\n    // Reset UI\n    document.getElementById('articleArea').innerHTML = l.articleHtml;\n    document.getElementById('headingsArea').innerHTML = l.headingsHtml;\n    document.getElementById('qs').innerHTML = '';\n    document.getElementById('progressBar').innerHTML = '';\n    document.getElementById('saveBtn').style.display = 'none';\n    \n    // Reset Timer\n    clearInterval(timerInterval);\n    timeLeft = l.timeLimit * 60;\n    timerEl.innerText = \"--:--\";\n    startTimer();\n\n    // Render Questions & Attach Events\n    renderStudentQuestions();\n    attachEvents();\n\n    // Manage Views\n    if(document.getElementById('game-view').style.display === 'block') initGame();\n    if(document.getElementById('mif-view').style.display === 'flex') {\n        document.getElementById('mif-view').style.display = 'none';\n    }\n}\n\n// --- RENDERING QUESTIONS ---\nfunction renderStudentQuestions() {\n    const qDiv=document.getElementById('qs');\n    qDiv.innerHTML = '';\n    \n    qs.forEach(q=>{\n      if(q.type==='text-only'){ qDiv.innerHTML+=`<div class=\"text-only\">${q.text}</div>`; }\n      else if(q.type==='summary') { \n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          let txt = q.text.replace(/\\n/g, '<br>');\n          q.gapIds.forEach(gid => {\n              const isFeat = q.isFeature ? 'true' : 'false';\n              \n              const loc = (q.locations && q.locations[gid]) ? q.locations[gid] : \"\";\n              const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${gid})\">📍</button>` : \"\";\n              \n              const dz = `<span class=\"drop-zone\" id=\"dz-${gid}\" data-gid=\"${gid}\" data-isfeat=\"${isFeat}\" ondragover=\"allowDrop(event)\" ondrop=\"drop(event)\" onclick=\"clearDrop(${gid})\"></span><span class=\"q-num\" style=\"vertical-align:super;font-size:10px\">${gid}</span>${locBtn}&nbsp;`;\n              \n              // Dùng nối chuỗi (String concatenation) thay cho template literal để tránh lỗi invalid token\n              let replaced = txt.replace(new RegExp(gid + '\\\\s*([._…-]{2,}|_{2,}|…+)'), dz);\n              if(replaced === txt) replaced = txt.replace(new RegExp(gid + '[.]\\\\s+'), dz + ' ');\n              txt = replaced;\n              \n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n          h += `<div style=\"line-height:2;font-size:15px\">${txt}</div><div style=\"margin-top:15px;display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed #e2e8f0\">`;\n          q.options.forEach(optLine => {\n              const m = optLine.match(/^([A-Z])\\s*[.)]?\\s*(.+)/);\n              if(m) h += `<div class=\"heading-item\" id=\"opt-${q.id}-${m[1]}\" style=\"display:inline-flex;width:auto;margin:0\" draggable=\"true\" ondragstart=\"drag(event)\" data-val=\"${m[1]}\"><span style=\"font-weight:bold;color:#2563eb\">${m[1]}</span> ${m[2]}</div>`;\n          });\n          h += `</div><div id=\"fb-${q.id}\" style=\"margin-top:10px; font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n      }\n      else if(q.type==='gap-fill-block') { \n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          let txt = q.text.replace(/\\n/g, '<br>'); \n          q.gapIds.forEach(gid => {\n              const loc = (q.locations && q.locations[gid]) ? q.locations[gid] : \"\";\n              const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${gid})\">📍</button>` : \"\";\n              const inp = `<span class=\"q-num\">${gid}</span><input type=\"text\" class=\"gap-input\" data-gid=\"${gid}\" oninput=\"upd(${gid})\">${locBtn}&nbsp;`;\t\n              txt = txt.replace(new RegExp(`${gid}[\\\\s:.)]*(?:[_….\\\\-]\\\\s*){2,}`), inp);\n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n          h += `<div style=\"line-height:2.2;font-size:16px\">${txt}</div><div id=\"fb-${q.id}\" style=\"margin-top:10px; font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n      }\n      else if(q.type==='mcq-multi') {\n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          const locBtn1 = (q.locations && q.locations[q.gapIds[0]]) ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${q.gapIds[0]})\">📍</button>` : \"\";\n          h += `<div style=\"display:flex;align-items:baseline;margin-bottom:8px;\"><span class=\"q-num\">${q.gapIds[0]}-${q.gapIds[q.gapIds.length-1]}</span> <span>${q.text}</span> ${locBtn1}</div>`;\n          q.options.forEach((o, i) => {\n              const optLetterMatch = o.match(/^([A-Z])/i);\n              const optLetter = optLetterMatch ? optLetterMatch[1].toUpperCase() : o.trim()[0].toUpperCase();\n              h += `<label style=\"display:block;margin:5px 0;cursor:pointer;transition:all 0.2s;\">\n                      <input type=\"checkbox\" name=\"mcq_${q.id}\" value=\"${optLetter}\" onchange=\"updMcqMulti(${q.id}, '${q.gapIds.join(',')}', event)\"> ${o} <span id=\"mcq-mark-${q.id}-${i}\" class=\"mcq-mark\"></span>\n                    </label>`;\n          });\n          h += `<div id=\"fb-${q.id}\" class=\"feedback\" style=\"margin-top:8px;font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n          q.gapIds.forEach(gid => {\n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n      }\n      else { \n        let h=`<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n        const loc = q.location || \"\";\n        const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id})\">📍</button>` : \"\";\n        \n        if(q.type==='gap-fill'){\n           let t=q.text.replace(/(\\d+)[\\s:.)]*(?:[_….\\-]\\s*){2,}/g, '<span class=\"q-num\">$1</span><input type=\"text\" class=\"gap-input\" data-id=\"'+q.id+'\" oninput=\"upd('+q.id+')\">'+locBtn+'&nbsp;');\n           h+=`<div>${t}</div>`;\n        } else {\n           h+=`<div style=\"display:flex;align-items:baseline\"><span class=\"q-num\">${q.id}.</span> <span>${q.text}</span> ${locBtn}</div>`;\n           if(q.type==='mcq') q.options.forEach((o, i) => { h += `<label class=\"mcq-label\" style=\"display:block;margin:5px 0;cursor:pointer\"><input type=\"radio\" name=\"q${q.id}\" value=\"${o.trim()[0]}\" onchange=\"upd(${q.id})\"> ${o} <span id=\"mcq-mark-${q.id}-${i}\" class=\"mcq-mark\"></span></label>`; });\n           if(q.type==='tfng') {\n               h+='<div class=\"tfng-container\">';\n               ['TRUE', 'FALSE', 'NOT GIVEN'].forEach(opt => {\n                   h+=`<label class=\"tfng-label\"><input type=\"radio\" name=\"tfng${q.id}\" value=\"${opt}\" onchange=\"upd(${q.id})\"><span class=\"tfng-btn\">${opt}</span></label>`;\n               });\n               h+='</div>';\n           }\n           if(q.type==='ynng') {\n               h+='<div class=\"tfng-container\">';\n               ['YES', 'NO', 'NOT GIVEN'].forEach(opt => {\n                   h+=`<label class=\"tfng-label\"><input type=\"radio\" name=\"ynng${q.id}\" value=\"${opt}\" onchange=\"upd(${q.id})\"><span class=\"tfng-btn\">${opt}</span></label>`;\n               });\n               h+='</div>';\n           }\n           if(q.type==='mif') {\n               h+='<div class=\"mif-container\">';\n               mifRange.split('').forEach(char => {\n                   h+=`<label class=\"mif-label\"><input type=\"radio\" name=\"mif${q.id}\" value=\"${char}\" onchange=\"upd(${q.id})\"><span class=\"mif-circle\">${char}</span></label>`;\n               });\n               h+='</div>';\n           }\n        }\n        h+=`<div id=\"fb-${q.id}\" class=\"feedback\" style=\"margin-top:8px;font-size:13px\"></div></div>`;\n        qDiv.innerHTML+=h;\n        const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+q.id; d.innerText=q.id;\n        d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n        document.getElementById('progressBar').appendChild(d);\n      }\n    });\n\n    document.querySelectorAll('input[type=\"radio\"][name^=\"mif\"]').forEach(radio => {\n        radio.addEventListener('change', (e) => {\n            const qId = radio.name.replace('mif', '');\n            const pChar = radio.value;\n            document.querySelectorAll(`.mif-inline-btn[data-qid=\"${qId}\"]`).forEach(btn => {\n                const btnPara = btn.closest('.mif-inline-box').dataset.para;\n                if(btnPara === pChar) {\n                    btn.classList.remove('hidden-by-other');\n                    btn.classList.add('selected');\n                } else {\n                    btn.classList.remove('selected');\n                    btn.classList.add('hidden-by-other');\n                }\n            });\n        });\n    });\n}\n\nfunction attachEvents() {\n    const pp = document.getElementById('popup');\n    document.querySelectorAll('.vocab').forEach(s => {\n      s.onclick = e => {\n        const v = vocab.find(x => x.id === s.dataset.vid); if(!v) return;\n        pp.innerHTML = `<div style=\"background:#1e293b;color:#fff;padding:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center\"><div><span>${v.word}</span> <span style=\"font-weight:normal;font-size:12px;color:#94a3b8;margin-left:8px\">${v.phonetic||''}</span></div><span onclick=\"speak('${v.word}')\" style=\"cursor:pointer;background:#334155;padding:4px;border-radius:50%\">🔊</span></div><div style=\"padding:16px;font-size:14px;color:#334155\"><p style=\"margin-bottom:8px\"><b style=\"color:#0f172a\">Meaning:</b> ${v.meaning}</p><p style=\"margin-bottom:8px\"><b style=\"color:#0f172a\">Synonyms:</b> ${v.synonym}</p><div style=\"background:#f1f5f9;padding:8px;border-radius:6px;margin-top:8px;color:#475569;font-style:italic\">\"${v.example}\"</div></div>`;\n        pp.style.display = 'block'; pp.style.top = (e.clientY+10) + 'px'; pp.style.left = Math.min(e.clientX, window.innerWidth-330) + 'px';\n        e.stopPropagation();\n      }\n    });\n\n    document.querySelectorAll('.sent').forEach(el => {\n        el.addEventListener('mouseenter', () => {\n            const tid = el.getAttribute('data-target'); const t = document.getElementById(tid);\n            if(t) t.style.backgroundColor = '#fef08a'; \n        });\n        el.addEventListener('mouseleave', () => {\n            const tid = el.getAttribute('data-target'); const t = document.getElementById(tid);\n            if(t) t.style.backgroundColor = 'transparent';\n        });\n    });\n}\n\nfunction allowDrop(ev) { ev.preventDefault(); }\nfunction drag(ev) { \n    const el = ev.target.closest('[draggable=\"true\"]') || ev.target;\n    const val = el.dataset.val || el.innerText.split('.')[0].trim();\n    ev.dataTransfer.setData(\"text\", val); \n    ev.dataTransfer.setData(\"srcId\", el.id); \n}\nfunction dragHeading(ev) { \n    const el = ev.target.closest('.heading-item');\n    ev.dataTransfer.setData(\"hid\", el.dataset.hid); \n    ev.dataTransfer.setData(\"srcId\", el.id); \n}\nfunction drop(ev) {\n    ev.preventDefault();\n    const zone = ev.target.closest('.drop-zone');\n    if(!zone) return;\n    \n    const type = zone.dataset.type;\n    if (type === 'heading') {\n        const hid = ev.dataTransfer.getData(\"hid\");\n        if(!hid) return; \n        zone.innerHTML = hid.toUpperCase(); \n        zone.dataset.val = hid; \n        zone.classList.add('filled');\n        \n        const srcId = ev.dataTransfer.getData(\"srcId\");\n        document.getElementById(srcId).classList.add('used');\n        if(zone.dataset.prevSrc && zone.dataset.prevSrc !== srcId) document.getElementById(zone.dataset.prevSrc).classList.remove('used');\n        zone.dataset.prevSrc = srcId;\n        return;\n    }\n    const val = ev.dataTransfer.getData(\"text\");\n    if(val) {\n        zone.innerText = val; \n        zone.classList.add('filled');\n        const gid = zone.dataset.gid;\n        document.getElementById('prog-'+gid).classList.add('filled');\n        \n        const isFeat = zone.dataset.isfeat === 'true';\n        const doRemove = isFeat ? removeFeatureOpt : removeOpt;\n        \n        if(doRemove) {\n            const srcId = ev.dataTransfer.getData(\"srcId\");\n            if(srcId) {\n                const srcEl = document.getElementById(srcId);\n                if(srcEl) srcEl.classList.add('used');\n                if(zone.dataset.prevSrc && zone.dataset.prevSrc !== srcId) {\n                    const prevEl = document.getElementById(zone.dataset.prevSrc);\n                    if(prevEl) prevEl.classList.remove('used');\n                }\n                zone.dataset.prevSrc = srcId;\n            }\n        }\n    }\n}\n\nfunction clearHeading(idx) {\n    const el = document.querySelector(`.heading-drop[data-para=\"${idx}\"]`);\n    if(el.dataset.prevSrc) document.getElementById(el.dataset.prevSrc).classList.remove('used');\n    el.innerHTML = '<span class=\"placeholder\">Drop Heading Here</span>'; el.classList.remove('filled'); delete el.dataset.val;\n}\nfunction clearDrop(gid) {\n    const el = document.getElementById('dz-'+gid);\n    const isFeat = el.dataset.isfeat === 'true';\n    const doRemove = isFeat ? removeFeatureOpt : removeOpt;\n    \n    if(doRemove && el.dataset.prevSrc) {\n        const prevEl = document.getElementById(el.dataset.prevSrc);\n        if(prevEl) prevEl.classList.remove('used');\n        delete el.dataset.prevSrc;\n    }\n    \n    el.innerText=''; el.classList.remove('filled'); document.getElementById('prog-'+gid).classList.remove('filled');\n}\n\nconst hlToolbar = document.getElementById('hl-toolbar');\nlet currentRange = null;\ndocument.addEventListener('mouseup', (e) => {\n    if(e.target.closest('#hl-toolbar')) return;\n    if(e.target.closest('#game-view')) return;\n    setTimeout(() => {\n        const sel = window.getSelection();\n        if(sel.toString().trim().length > 0) {\n            const range = sel.getRangeAt(0);\n            const parent = range.commonAncestorContainer.parentElement;\n            if(parent.closest('.en-text') || parent.closest('.q-block') || parent.closest('.text-only')) {\n                currentRange = range;\n                const rect = range.getBoundingClientRect();\n                hlToolbar.style.display = 'flex'; \n                hlToolbar.style.top = (rect.top + window.scrollY - 40) + 'px'; \n                hlToolbar.style.left = (rect.left + (rect.width/2)) + 'px';\n                return;\n            }\n        }\n        hlToolbar.style.display = 'none';\n    }, 10);\n});\n\nwindow.applyHighlight = (e) => {\n    e.preventDefault(); e.stopPropagation();\n    if(currentRange) {\n        const span = document.createElement('span'); span.className = 'user-highlight'; span.setAttribute('onclick', 'removeHighlight(this, event)');\n        try { currentRange.surroundContents(span); window.getSelection().removeAllRanges(); } catch(err) { alert('Selection quá phức tạp, vui lòng bôi đen gọn hơn.'); }\n        hlToolbar.style.display = 'none';\n    }\n};\n\nwindow.applyNote = (e) => {\n    e.preventDefault(); e.stopPropagation();\n    if(currentRange) {\n        const noteText = prompt('Nhập ghi chú của bạn:');\n        if(noteText) {\n            const span = document.createElement('span'); \n            span.className = 'user-highlight has-note'; \n            span.setAttribute('onclick', 'removeHighlight(this, event)');\n            span.title = noteText;\n            try { currentRange.surroundContents(span); window.getSelection().removeAllRanges(); } catch(err) { alert('Selection quá phức tạp, vui lòng bôi đen gọn hơn.'); }\n        }\n        hlToolbar.style.display = 'none';\n    }\n};\n\nwindow.removeHighlight = (el, e) => { \n    e.stopPropagation(); \n    if(el.classList.contains('has-note') && !confirm('Xóa ghi chú này?')) return;\n    const txt = document.createTextNode(el.innerText); \n    el.parentNode.replaceChild(txt, el); \n    hlToolbar.style.display = 'none'; \n};\n\nwindow.showLoc = (qId, subId) => {\n    document.querySelectorAll('.loc-highlight').forEach(el => el.classList.remove('loc-highlight'));\n    const q = qs.find(x => x.id === qId); if(!q) return;\n    let text = \"\";\n    if(subId && q.locations && q.locations[subId]) text = q.locations[subId]; else if(q.location) text = q.location;\n    if(!text) return alert(\"No location data found.\");\n    \n    const cleanText = text.trim().replace(/\\s+/g, ' ').toLowerCase();\n    const sents = document.querySelectorAll('.sent'); let found = false;\n    sents.forEach(s => {\n        const sText = s.innerText.trim().replace(/\\s+/g, ' ').toLowerCase();\n        if(sText.includes(cleanText) || (cleanText.length > 20 && cleanText.includes(sText))) {\n            s.classList.add('loc-highlight');\n            if(!found) { s.scrollIntoView({behavior: 'smooth', block: 'center'}); found = true; }\n        }\n    });\n    if(!found) alert(\"Could not find exact text match in passage.\");\n};\n\nwindow.upd = (id) => document.getElementById('prog-'+id).classList.add('filled');\nwindow.updMcqMulti = (qId, gapIdsStr, ev) => {\n    const gapIds = gapIdsStr.split(',');\n    const checkboxes = document.querySelectorAll(`input[name=\"mcq_${qId}\"]`);\n    const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;\n    const maxAllowed = gapIds.length;\n    if (checkedCount > maxAllowed) { ev.target.checked = false; alert(\"Bạn chỉ được chọn tối đa \" + maxAllowed + \" đáp án!\"); return; }\n    gapIds.forEach((gid, index) => {\n        const p = document.getElementById('prog-'+gid);\n        if(p) { if(index < checkedCount) p.classList.add('filled'); else p.classList.remove('filled'); }\n    });\n};\n\nwindow.check = () => {\n    document.querySelectorAll('.ans-key, .inline-exp').forEach(e=>e.remove());\n    document.querySelectorAll('.input-correct, .input-wrong, .correct-zone, .wrong-zone, .correct-opt, .wrong-opt').forEach(e=>e.classList.remove('input-correct','input-wrong','correct-zone','wrong-zone','correct-opt','wrong-opt'));\n\tdocument.querySelectorAll('.prog-correct, .prog-wrong').forEach(e=>e.classList.remove('prog-correct','prog-wrong'));\n    document.querySelectorAll('.mcq-mark').forEach(e=>e.innerText='');\n\n    let score = 0, total = 0; let allAnswered = true;\n    \n    if(headings.length > 0) {\n        document.querySelectorAll('.heading-drop').forEach(z => {\n            const pIdx = z.dataset.para, userVal = (z.dataset.val || \"\").toUpperCase(), correctVal = (headingKey[pIdx] || \"\").toUpperCase();\n            if(correctVal) { \n                total++; const fb = document.getElementById('fb-h-'+pIdx);\n                if(userVal === correctVal) { fb.innerHTML = '<span class=\"correct\">✓</span>'; score++; } \n                else { fb.innerHTML = `<span class=\"wrong\">✗</span> <span class=\"correct\">${correctVal}</span>`; }\n            }\n        });\n    }\n\n    qs.forEach(q => {\n        if(q.type === 'summary' || q.type === 'gap-fill-block') {\n    total += q.gapIds.length;\n    q.gapIds.forEach(gid => {\n        let userVal = \"\"; let el = null; const keyVal = (q.answers[gid] || \"\").trim();\n        let isCorrect = false;\n\n        if(q.type==='summary') {\n            el=document.getElementById('dz-'+gid); userVal = el?el.innerText.trim():\"\";\n            if(el) {\n                if(userVal.toLowerCase() === keyVal.toLowerCase()) { el.classList.add('correct-zone'); isCorrect = true; }\n                else { el.classList.add('wrong-zone'); }\n            }\n        }\n        if(q.type==='gap-fill-block') {\n            el=document.querySelector(`input[data-gid=\"${gid}\"]`); userVal = el?el.value.trim():\"\";\n            if(el) {\n                 if(userVal.toLowerCase() === keyVal.toLowerCase()) { el.classList.add('input-correct'); isCorrect = true; }\n                else { el.classList.add('input-wrong'); }\n            }\n        }\n\n        if(el) {\n            let insertHtml = '';\n\n            // Xử lý key đúng/sai\n            if(isCorrect) {\n                score++;\n                document.getElementById('prog-'+gid).classList.add('prog-correct');\n            } else {\n                insertHtml += `<span class=\"ans-key\">${keyVal}</span>`;\n                document.getElementById('prog-'+gid).classList.add('prog-wrong');\n            }\n\n            // Chèn explanation dạng inline popup ngay cạnh gap\n           if(q.explanations && q.explanations[gid]) {\n    insertHtml += `<span class=\"inline-exp\" style=\"display:inline-block; margin-left:6px; position:relative; vertical-align:middle;\">\n        <button class=\"exp-btn\" style=\"padding:2px 6px; font-size:10px; margin:0;\" onclick=\"event.stopPropagation(); document.querySelectorAll('.inline-exp .exp-box').forEach(b => { if(b !== this.nextElementSibling) b.classList.add('hidden'); }); this.nextElementSibling.classList.toggle('hidden')\">💡 Exp</button>\n        <span class=\"exp-box hidden\" style=\"position:absolute; top:100%; left:50%; transform:translateX(-50%); z-index:50; width:max-content; max-width:250px; margin-top:4px; padding:8px; background:#f5f3ff; box-shadow:0 4px 6px rgba(0,0,0,0.1); border:1px solid #c4b5fd; border-radius:4px; font-weight:normal; text-align:left; line-height:1.4; color:#4c1d95;\">${q.explanations[gid]}</span>\n    </span>`;\n}\n\n            // Chèn tất cả vào DOM ngay sau phần tử input/drop-zone\n            if(insertHtml) el.insertAdjacentHTML('afterend', insertHtml);\n        }\n    });\n}\n        else if (q.type === 'mcq-multi') {\n            const count = q.gapIds.length;\n            total += count;\n            const checkboxes = document.querySelectorAll(`input[name=\"mcq_${q.id}\"]:checked`);\n            let userVals = Array.from(checkboxes).map(cb => cb.value.toUpperCase());\n            let correctVals = q.gapIds.map(gid => (q.answers[gid] || \"\").toUpperCase().trim());\n            let origCorrectVals = [...correctVals].filter(v=>v);\n\n            let localScore = 0;\n            userVals.forEach(uv => { const idx = correctVals.indexOf(uv); if (idx > -1) { localScore++; correctVals[idx] = null; } });\n            score += localScore;\n\n            const allCheckboxes = document.querySelectorAll(`input[name=\"mcq_${q.id}\"]`);\n            allCheckboxes.forEach((cb, i) => {\n                const val = cb.value.toUpperCase(); \n                const markSpan = document.getElementById(`mcq-mark-${q.id}-${i}`); \n                const label = cb.closest('label');\n                label.style.border = 'none'; label.style.padding = '0'; label.style.backgroundColor = 'transparent'; \n                if     const select = document.getElementById('selectBai');
    const openBtn = document.getElementById('openBtn');
    const clearBtn = document.getElementById('clearBtn');
    const frame = document.getElementById('frame');
    const controlsBar = document.getElementById('controlsBar');

    // populate select
    items.forEach((it, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = it.name || it.filename || ('Bài ' + (idx+1));
      select.appendChild(opt);
    });

    function enterFullscreenMode() {
      // hide controls and expand iframe
      controlsBar.classList.add('hidden');
      frame.classList.add('fullscreen-frame');

      // create close button if chưa có
      if (!document.getElementById('closeFullscreen')) {
        const btn = document.createElement('button');
        btn.id = 'closeFullscreen';
        btn.textContent = 'Đóng toàn màn hình';
        btn.onclick = exitFullscreenMode;
        document.body.appendChild(btn);
      }
    }

    function exitFullscreenMode() {
      // restore controls and iframe
      controlsBar.classList.remove('hidden');
      frame.classList.remove('fullscreen-frame');
      const btn = document.getElementById('closeFullscreen');
      if (btn) btn.remove();
    }

    openBtn.onclick = () => {
      const v = select.value;
      if (v === '') {
        alert('Vui lòng chọn một bài.');
        return;
      }
      const it = items[+v];
      frame.srcdoc = it.content;

      // vào chế độ toàn màn hình
      enterFullscreenMode();
    };

    clearBtn.onclick = () => {
      select.value = '';
      frame.srcdoc = '<p>Chưa chọn bài</p>';
    };

    // allow Enter key to open when select focused
    select.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') openBtn.click();
    });

    // Escape để thoát toàn màn hình
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        exitFullscreenMode();
      }
    });
  </script>
